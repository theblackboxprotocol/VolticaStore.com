<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Voltica Store — The Future of Everyday</title>

    <meta
        name="description"
        content="Voltica Store — Premium technology, design and everyday essentials."
    >

    <style>

        /* =====================================================
           RESET
        ===================================================== */

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        html {
            scroll-behavior: smooth;
        }


        body {

            min-height: 100vh;

            background: #020203;

            color: #fff;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            overflow-x: hidden;
        }


        /* =====================================================
           GLOBAL BACKGROUND
        ===================================================== */

        .voltica-world {

            position: fixed;

            inset: 0;

            z-index: -10;

            overflow: hidden;

            background:

                radial-gradient(
                    circle at 50% 40%,
                    rgba(255,255,255,0.055),
                    transparent 28%
                ),

                radial-gradient(
                    circle at 15% 20%,
                    rgba(80,100,140,0.12),
                    transparent 30%
                ),

                radial-gradient(
                    circle at 85% 75%,
                    rgba(120,80,180,0.10),
                    transparent 30%
                ),

                #020203;
        }


        /* =====================================================
           ACRYLIC LIGHT
        ===================================================== */

        .light-orb {

            position: absolute;

            width: 45vw;

            height: 45vw;

            max-width: 700px;

            max-height: 700px;

            border-radius: 50%;

            filter: blur(80px);

            opacity: 0.18;

            animation:
                orbFloat 14s ease-in-out infinite;
        }


        .orb-one {

            top: -15%;

            left: -10%;

            background:
                radial-gradient(
                    circle,
                    rgba(120,140,180,0.55),
                    transparent 68%
                );
        }


        .orb-two {

            right: -15%;

            bottom: -15%;

            background:
                radial-gradient(
                    circle,
                    rgba(130,90,190,0.48),
                    transparent 68%
                );

            animation-delay: -5s;
        }


        .orb-three {

            left: 40%;

            top: 35%;

            width: 25vw;

            height: 25vw;

            background:
                radial-gradient(
                    circle,
                    rgba(255,255,255,0.20),
                    transparent 70%
                );

            animation-delay: -9s;
        }


        @keyframes orbFloat {

            0%,
            100% {

                transform:
                    translate3d(0,0,0)
                    scale(1);
            }

            50% {

                transform:
                    translate3d(35px,-25px,0)
                    scale(1.08);
            }
        }


        /* =====================================================
           GRID
        ===================================================== */

        .tech-grid {

            position: absolute;

            inset: -20%;

            opacity: 0.13;

            background-image:

                linear-gradient(
                    rgba(255,255,255,0.055) 1px,
                    transparent 1px
                ),

                linear-gradient(
                    90deg,
                    rgba(255,255,255,0.055) 1px,
                    transparent 1px
                );

            background-size:
                70px 70px;

            transform:
                perspective(700px)
                rotateX(62deg)
                scale(1.5);

            transform-origin:
                center center;

            animation:
                gridMove 18s linear infinite;
        }


        @keyframes gridMove {

            from {

                background-position:
                    0 0;
            }

            to {

                background-position:
                    0 70px;
            }
        }


        /* =====================================================
           MOVING LIGHT RIBBON
        ===================================================== */

        .light-ribbon {

            position: absolute;

            width: 150%;

            height: 1px;

            left: -25%;

            top: 48%;

            background:

                linear-gradient(
                    90deg,
                    transparent,
                    rgba(255,255,255,0.04),
                    rgba(255,255,255,0.45),
                    rgba(255,255,255,0.04),
                    transparent
                );

            filter:
                blur(1px);

            transform:
                rotate(-12deg);

            animation:
                ribbonMove 8s ease-in-out infinite;
        }


        @keyframes ribbonMove {

            0% {

                transform:
                    translateX(-25%)
                    rotate(-12deg);

                opacity: 0;
            }

            35% {

                opacity: 1;
            }

            70% {

                opacity: 0.7;
            }

            100% {

                transform:
                    translateX(25%)
                    rotate(-12deg);

                opacity: 0;
            }
        }


        /* =====================================================
           PARTICLES
        ===================================================== */

        .particles {

            position: absolute;

            inset: 0;

            background-image:

                radial-gradient(
                    circle,
                    rgba(255,255,255,0.7) 1px,
                    transparent 1px
                );

            background-size:
                160px 160px;

            opacity: 0.13;

            animation:
                particlesMove 25s linear infinite;
        }


        @keyframes particlesMove {

            from {

                background-position:
                    0 0;
            }

            to {

                background-position:
                    160px 160px;
            }
        }


        /* =====================================================
           VIGNETTE
        ===================================================== */

        .vignette {

            position: absolute;

            inset: 0;

            background:

                radial-gradient(
                    ellipse at center,
                    transparent 35%,
                    rgba(0,0,0,0.72) 100%
                );

            pointer-events: none;
        }


        /* =====================================================
           MAIN
        ===================================================== */

        .landing {

            position: relative;

            min-height: 100svh;

            display: flex;

            align-items: center;

            justify-content: center;

            padding:
                50px 25px;
        }


        /* =====================================================
           CENTRAL CONTENT
        ===================================================== */

        .hero-card {

            position: relative;

            width:
                min(1000px, 94vw);

            min-height:
                min(720px, 88svh);

            display: flex;

            flex-direction: column;

            align-items: center;

            justify-content: center;

            text-align: center;

            padding:
                70px 30px;

            border:
                1px solid
                rgba(255,255,255,0.11);

            border-radius: 40px;

            background:

                linear-gradient(
                    145deg,
                    rgba(255,255,255,0.065),
                    rgba(255,255,255,0.018)
                );

            backdrop-filter:
                blur(22px)
                saturate(125%);

            -webkit-backdrop-filter:
                blur(22px)
                saturate(125%);

            box-shadow:

                inset 0 1px 0
                rgba(255,255,255,0.13),

                inset 0 -1px 0
                rgba(0,0,0,0.45),

                0 40px 120px
                rgba(0,0,0,0.70);

            overflow: hidden;

            animation:
                cardEnter 1.4s ease both;
        }


        @keyframes cardEnter {

            from {

                opacity: 0;

                transform:
                    translateY(30px)
                    scale(0.97);
            }

            to {

                opacity: 1;

                transform:
                    translateY(0)
                    scale(1);
            }
        }


        /* =====================================================
           CARD REFLECTION
        ===================================================== */

        .hero-card::before {

            content: "";

            position: absolute;

            width: 40%;

            height: 180%;

            top: -40%;

            left: -60%;

            background:

                linear-gradient(
                    90deg,
                    transparent,
                    rgba(255,255,255,0.10),
                    transparent
                );

            transform:
                rotate(25deg);

            animation:
                cardSweep 7s ease-in-out infinite;

            pointer-events: none;
        }


        @keyframes cardSweep {

            0% {

                left: -65%;
            }

            35% {

                left: 135%;
            }

            100% {

                left: 135%;
            }
        }


        /* =====================================================
           TOP LABEL
        ===================================================== */

        .eyebrow {

            position: relative;

            z-index: 3;

            margin-bottom: 35px;

            font-size: 9px;

            letter-spacing: 0.55em;

            color:
                rgba(255,255,255,0.45);

            text-transform: uppercase;
        }


        /* =====================================================
           LOGO
        ===================================================== */

        .voltica-logo {

            position: relative;

            z-index: 3;

            width:
                min(570px, 78vw);

            max-height: 210px;

            object-fit: contain;

            margin-bottom: 35px;

            filter:

                drop-shadow(
                    0 0 22px
                    rgba(255,255,255,0.14)
                )

                drop-shadow(
                    0 25px 55px
                    rgba(0,0,0,0.85)
                );

            animation:
                logoFloat 6s ease-in-out infinite;
        }


        @keyframes logoFloat {

            0%,
            100% {

                transform:
                    translateY(0);
            }

            50% {

                transform:
                    translateY(-7px);
            }
        }


        /* =====================================================
           TAGLINE
        ===================================================== */

        .tagline {

            position: relative;

            z-index: 3;

            font-size:
                clamp(10px, 1.3vw, 13px);

            letter-spacing:
                clamp(4px, 0.8vw, 8px);

            text-transform:
                uppercase;

            color:
                rgba(255,255,255,0.62);

            margin-bottom: 45px;
        }


        /* =====================================================
           STORE BUTTON
        ===================================================== */

        .enter-store {

            position: relative;

            z-index: 4;

            display: inline-flex;

            align-items: center;

            justify-content: center;

            min-width: 250px;

            min-height: 64px;

            padding:
                18px 35px;

            border:
                1px solid
                rgba(255,255,255,0.38);

            border-radius: 16px;

            background:

                linear-gradient(
                    135deg,
                    rgba(255,255,255,0.12),
                    rgba(255,255,255,0.035)
                );

            backdrop-filter:
                blur(18px);

            -webkit-backdrop-filter:
                blur(18px);

            color: #fff;

            text-decoration: none;

            font-size: 11px;

            font-weight: 600;

            letter-spacing:
                0.35em;

            overflow: hidden;

            box-shadow:

                inset 0 1px 0
                rgba(255,255,255,0.20),

                0 20px 50px
                rgba(0,0,0,0.55);

            transition:
                transform 0.35s ease,
                border-color 0.35s ease,
                box-shadow 0.35s ease;
        }


        .enter-store::before {

            content: "";

            position: absolute;

            top: -100%;

            left: -80%;

            width: 45%;

            height: 300%;

            transform:
                rotate(25deg);

            background:

                linear-gradient(
                    90deg,
                    transparent,
                    rgba(255,255,255,0.28),
                    transparent
                );

            animation:
                buttonSweep 4.5s ease-in-out infinite;
        }


        @keyframes buttonSweep {

            0% {

                left: -80%;
            }

            30% {

                left: 160%;
            }

            100% {

                left: 160%;
            }
        }


        .enter-store span {

            position: relative;

            z-index: 2;
        }


        .enter-store:hover {

            transform:
                translateY(-5px)
                scale(1.025);

            border-color:
                rgba(255,255,255,0.65);

            box-shadow:

                inset 0 1px 0
                rgba(255,255,255,0.28),

                0 30px 75px
                rgba(0,0,0,0.70),

                0 0 45px
                rgba(255,255,255,0.08);
        }


        /* =====================================================
           BOTTOM STATUS
        ===================================================== */

        .status {

            position: absolute;

            bottom: 30px;

            left: 50%;

            transform:
                translateX(-50%);

            display: flex;

            align-items: center;

            gap: 9px;

            font-size: 8px;

            letter-spacing:
                0.28em;

            color:
                rgba(255,255,255,0.30);

            text-transform: uppercase;

            white-space: nowrap;
        }


        .status-dot {

            width: 5px;

            height: 5px;

            border-radius: 50%;

            background: rgba(255,255,255,0.75);

            box-shadow:
                0 0 12px
                rgba(255,255,255,0.55);

            animation:
                statusPulse 2s ease-in-out infinite;
        }


        @keyframes statusPulse {

            0%,
            100% {

                opacity: 0.35;
            }

            50% {

                opacity: 1;
            }
        }


        /* =====================================================
           MOBILE
        ===================================================== */

        @media (max-width: 600px) {

            .landing {

                padding:
                    20px 12px;
            }


            .hero-card {

                width: 100%;

                min-height:
                    calc(100svh - 40px);

                padding:
                    55px 20px;

                border-radius: 28px;
            }


            .eyebrow {

                margin-bottom: 25px;

                font-size: 7px;

                letter-spacing:
                    0.42em;
            }


            .voltica-logo {

                width: 86vw;

                max-height: 150px;

                margin-bottom: 25px;
            }


            .tagline {

                font-size: 8px;

                letter-spacing: 3px;

                line-height: 1.8;

                max-width: 280px;

                margin-bottom: 35px;
            }


            .enter-store {

                width: 85%;

                min-height: 62px;

                font-size: 10px;

                letter-spacing:
                    0.28em;
            }


            .status {

                bottom: 18px;

                font-size: 6px;
            }


            .tech-grid {

                background-size:
                    45px 45px;
            }

        }


        /* =====================================================
           REDUCE MOTION
        ===================================================== */

        @media (prefers-reduced-motion: reduce) {

            *,
            *::before,
            *::after {

                animation-duration:
                    0.01ms !important;

                animation-iteration-count:
                    1 !important;

                scroll-behavior:
                    auto !important;
            }
        }

    </style>

</head>


<body>


    <!-- =====================================================
         VOLTICA ANIMATED WORLD
         ===================================================== -->

    <div class="voltica-world">

        <div class="light-orb orb-one"></div>

        <div class="light-orb orb-two"></div>

        <div class="light-orb orb-three"></div>

        <div class="tech-grid"></div>

        <div class="particles"></div>

        <div class="light-ribbon"></div>

        <div class="vignette"></div>

    </div>



    <!-- =====================================================
         MAIN LANDING
         ===================================================== -->

    <main class="landing">


        <section class="hero-card">


            <div class="eyebrow">

                VOLTICA STORE

            </div>


            <!-- =================================================
                 MAIN LOGO

                 FILE:
                 voltiCAStore.com/voltica_alu_brosse.png

                 LOCAL FILE:
                 voltica_alu_brosse.png
                 ================================================= -->

            <img
                src="voltica_alu_brosse.png"
                alt="Voltica Store"
                class="voltica-logo">


            <div class="tagline">

                THE FUTURE OF EVERYDAY

            </div>


            <a
                href="store.html"
                class="enter-store">

                <span>
                    ENTER VOLTICA STORE
                </span>

            </a>


            <div class="status">

                <span class="status-dot"></span>

                PREMIUM DIGITAL COMMERCE

            </div>


        </section>


    </main>


</body>

</html>
