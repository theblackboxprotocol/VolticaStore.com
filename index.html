<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Voltica Store</title>

    <meta
        name="description"
        content="Voltica Premium — The future of everyday."
    >

    <style>

        /* =====================================================
           RESET
        ===================================================== */

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background: #000;
            color: #fff;
            font-family: Arial, Helvetica, sans-serif;
            overflow-x: hidden;
        }


        /* =====================================================
           VOLTICA STORE — TOP ENTRY
        ===================================================== */

        .store-entry {

            width: 100%;

            display: flex;

            justify-content: center;
            align-items: center;

            padding: 42px 20px 38px;

            background:
                radial-gradient(
                    circle at center,
                    rgba(255,255,255,0.07),
                    transparent 52%
                ),
                #000;

            position: relative;

            z-index: 50;
        }


        /* =====================================================
           MAIN STORE BUTTON
        ===================================================== */

        .store-header-button {

            position: relative;

            display: flex;

            flex-direction: column;

            align-items: center;

            justify-content: center;

            width: min(520px, 94vw);

            min-height: 190px;

            padding: 28px 35px;

            color: #fff;

            text-decoration: none;

            background:

                linear-gradient(
                    145deg,
                    rgba(255,255,255,0.14),
                    rgba(255,255,255,0.035)
                );

            border:
                1px solid
                rgba(255,255,255,0.24);

            border-radius: 30px;

            backdrop-filter:
                blur(30px)
                saturate(150%);

            -webkit-backdrop-filter:
                blur(30px)
                saturate(150%);

            box-shadow:

                inset 0 1px 0
                rgba(255,255,255,0.20),

                inset 0 -1px 0
                rgba(0,0,0,0.45),

                0 25px 80px
                rgba(0,0,0,0.65);

            overflow: hidden;

            transition:
                transform 0.4s ease,
                border-color 0.4s ease,
                box-shadow 0.4s ease;
        }


        /* =====================================================
           GLASS REFLECTION
        ===================================================== */

        .store-header-button::before {

            content: "";

            position: absolute;

            top: -150%;

            left: -70%;

            width: 28%;

            height: 400%;

            transform: rotate(24deg);

            background:

                linear-gradient(
                    90deg,
                    transparent,
                    rgba(255,255,255,0.28),
                    rgba(255,255,255,0.06),
                    transparent
                );

            animation:
                storeSweep 5.5s ease-in-out infinite;

            pointer-events: none;

            z-index: 1;
        }


        @keyframes storeSweep {

            0% {
                left: -70%;
            }

            25% {
                left: 155%;
            }

            100% {
                left: 155%;
            }
        }


    
           File assets/images/voltica_alu_brosse.png
           
        .store-logo-area {

            position: relative;

            z-index: 3;

            width: 100%;

            height: 105px;

            display: flex;

            align-items: center;

            justify-content: center;

            margin-bottom: 15px;
        }


        .store-logo-image {

            display: block;

            width: auto;

            height: 90px;

            max-width: 82%;

            object-fit: contain;

            filter:

                drop-shadow(
                    0 0 18px
                    rgba(255,255,255,0.14)
                )

                drop-shadow(
                    0 15px 35px
                    rgba(0,0,0,0.75)
                );

            transition:
                transform 0.4s ease,
                filter 0.4s ease;
        }


        /* =====================================================
           TEXT
        ===================================================== */

        .store-header-text {

            position: relative;

            z-index: 3;

            display: flex;

            flex-direction: column;

            align-items: center;

            gap: 6px;

            text-align: center;
        }


        .store-header-text small {

            font-size: 8px;

            letter-spacing: 0.42em;

            color:
                rgba(255,255,255,0.42);

            text-transform: uppercase;
        }


        .store-header-text strong {

            font-size: 17px;

            letter-spacing: 0.28em;

            font-weight: 600;

            color:
                rgba(255,255,255,0.96);

            text-transform: uppercase;
        }


        /* =====================================================
           HOVER
        ===================================================== */

        .store-header-button:hover {

            transform:
                translateY(-7px)
                scale(1.015);

            border-color:
                rgba(255,255,255,0.50);

            box-shadow:

                inset 0 1px 0
                rgba(255,255,255,0.25),

                0 35px 90px
                rgba(0,0,0,0.75),

                0 0 55px
                rgba(255,255,255,0.09);
        }


        .store-header-button:hover
        .store-logo-image {

            transform:
                scale(1.045);

            filter:

                drop-shadow(
                    0 0 28px
                    rgba(255,255,255,0.20)
                )

                drop-shadow(
                    0 18px 40px
                    rgba(0,0,0,0.8)
                );
        }


        /* =====================================================
           HERO
        ===================================================== */

        .hero {

            position: relative;

            width: 100%;

            height: 100svh;

            min-height: 650px;

            overflow: hidden;

            background: #000;
        }


        .hero-video {

            position: absolute;

            inset: 0;

            width: 100%;
            height: 100%;

            object-fit: cover;
        }


        .hero-overlay {

            position: absolute;

            inset: 0;

            background:
                linear-gradient(
                    to bottom,
                    rgba(0,0,0,0.15) 0%,
                    rgba(0,0,0,0.25) 45%,
                    rgba(0,0,0,0.90) 100%
                );
        }


        .hero-content {

            position: absolute;

            z-index: 5;

            left: 50%;
            bottom: 8%;

            transform:
                translateX(-50%);

            width:
                min(900px, 92%);

            display: flex;

            flex-direction: column;

            align-items: center;

            text-align: center;
        }


        .logo {

            width:
                min(420px, 72vw);

            height: auto;

            margin-bottom: 22px;

            filter:
                drop-shadow(
                    0 0 20px
                    rgba(255,255,255,0.12)
                )
                drop-shadow(
                    0 20px 45px
                    rgba(0,0,0,0.8)
                );
        }


        .tagline {

            font-size: 12px;

            letter-spacing: 7px;

            text-transform: uppercase;

            color:
                rgba(255,255,255,0.78);

            margin-bottom: 30px;
        }


        /* =====================================================
           PREORDER BUTTON
        ===================================================== */

        .preorder {

            display: inline-flex;

            align-items: center;

            justify-content: center;

            padding:
                17px 34px;

            border:
                1px solid
                rgba(255,255,255,0.55);

            border-radius: 4px;

            background:
                rgba(255,255,255,0.08);

            backdrop-filter:
                blur(18px);

            -webkit-backdrop-filter:
                blur(18px);

            color: white;

            text-decoration: none;

            font-size: 12px;

            font-weight: 600;

            letter-spacing: 3px;

            transition:
                transform 0.3s ease,
                background 0.3s ease,
                box-shadow 0.3s ease;
        }


        .preorder:hover {

            transform:
                translateY(-3px);

            background:
                rgba(255,255,255,0.16);

            box-shadow:
                0 15px 50px
                rgba(255,255,255,0.12);
        }


        /* =====================================================
           PRODUCT SECTION
        ===================================================== */

        .product-section {

            position: relative;

            padding:
                110px 20px;

            background:

                radial-gradient(
                    circle at 50% 0%,
                    rgba(255,255,255,0.08),
                    transparent 45%
                ),

                #030303;
        }


        .section-label {

            text-align: center;

            font-size: 11px;

            letter-spacing: 5px;

            color:
                rgba(255,255,255,0.45);

            margin-bottom: 18px;
        }


        .section-title {

            text-align: center;

            font-size:
                clamp(32px, 6vw, 68px);

            font-weight: 300;

            letter-spacing: -2px;

            margin-bottom: 60px;
        }


        .product-video {

            display: block;

            width:
                min(1100px, 100%);

            max-height: 720px;

            margin: auto;

            object-fit: cover;

            border-radius: 12px;

            border:
                1px solid
                rgba(255,255,255,0.10);

            box-shadow:
                0 30px 100px
                rgba(0,0,0,0.8);
        }


        /* =====================================================
           PREORDER SECTION
        ===================================================== */

        .preorder-section {

            min-height: 500px;

            display: flex;

            flex-direction: column;

            align-items: center;

            justify-content: center;

            text-align: center;

            padding:
                100px 20px;

            background: #000;
        }


        .preorder-section h2 {

            font-size:
                clamp(35px, 7vw, 75px);

            font-weight: 300;

            margin-bottom: 20px;
        }


        .preorder-section p {

            max-width: 600px;

            color:
                rgba(255,255,255,0.55);

            line-height: 1.7;

            margin-bottom: 35px;
        }


        /* =====================================================
           FOOTER
        ===================================================== */

        footer {

            padding:
                35px 20px;

            text-align: center;

            border-top:
                1px solid
                rgba(255,255,255,0.08);

            color:
                rgba(255,255,255,0.35);

            font-size: 10px;

            letter-spacing: 3px;
        }


        /* =====================================================
           MOBILE
        ===================================================== */

        @media (max-width: 600px) {

            .store-entry {

                padding:
                    25px 15px 22px;
            }


            .store-header-button {

                width: 100%;

                max-width: 420px;

                min-height: 170px;

                padding:
                    25px 20px;

                border-radius: 25px;
            }


            .store-logo-area {

                height: 85px;

                margin-bottom: 12px;
            }


            .store-logo-image {

                height: 72px;

                max-width: 85%;
            }


            .store-header-text strong {

                font-size: 13px;

                letter-spacing: 0.22em;
            }


            .store-header-text small {

                font-size: 7px;

                letter-spacing: 0.34em;
            }


            .hero {

                min-height: 700px;
            }


            .hero-content {

                bottom: 7%;
            }


            .logo {

                width: 82vw;
            }


            .tagline {

                font-size: 9px;

                letter-spacing: 4px;
            }


            .preorder {

                width: 85%;

                padding:
                    17px 20px;
            }


            .product-section {

                padding:
                    80px 15px;
            }

        }

    </style>

</head>


<body>


    <!-- =====================================================
         VOLTICA STORE — MAIN STORE BUTTON
         ===================================================== -->

    <div class="store-entry">

        <a
            href="store.html"
            class="store-header-button">


            <!-- =================================================
                 LOGO UPLOAD AREA

                 PUT YOUR TRANSPARENT LOGO HERE:

                 assets/images/voltica-store-logo.png

                 PNG / WEBP with transparent background
                 ================================================= -->

            <span class="store-logo-area">

                <img
                    src="assets/images/voltica-store-logo.png"
                    alt="Voltica Store"
                    class="store-logo-image">

            </span>


            <span class="store-header-text">

                <small>
                    EXPLORE
                </small>

                <strong>
                    VOLTICA STORE
                </strong>

            </span>

        </a>

    </div>



    <!-- =====================================================
         HERO / FIRST VIDEO
         ===================================================== -->

    <section class="hero">

        <video
            class="hero-video"
            autoplay
            muted
            loop
            playsinline
            preload="metadata">

            <source
                src="317a572754805f82f4051fe7fb3414ef.mp4"
                type="video/mp4">

        </video>


        <div class="hero-overlay"></div>


        <div class="hero-content">

            <img
                src="voltica_logo_face.png"
                alt="Voltica Premium"
                class="logo">


            <div class="tagline">
                The Future of Everyday
            </div>


            <a
                href="#preorder"
                class="preorder">

                PRE-ORDER — AUGUST 21ST

            </a>

        </div>

    </section>



    <!-- =====================================================
         PRODUCT VIDEO
         ===================================================== -->

    <section class="product-section">

        <div class="section-label">
            VOLTICA PREMIUM
        </div>


        <h2 class="section-title">
            Designed to stand out.
        </h2>


        <video
            class="product-video"
            autoplay
            muted
            loop
            playsinline
            controls
            preload="metadata">

            <source
                src="FB_VID_6898437286649732159.mp4"
                type="video/mp4">

        </video>

    </section>



    <!-- =====================================================
         PREORDER
         ===================================================== -->

    <section
        class="preorder-section"
        id="preorder">

        <div class="section-label">
            VOLTICA STORE
        </div>


        <h2>
            Your next favorite.
        </h2>


        <p>
            Premium design. Smart technology.
            Made to stand out from the ordinary.
        </p>


        <a
            href="product.html"
            class="preorder">

            PRE-ORDER — AUGUST 21ST

        </a>

    </section>



    <!-- =====================================================
         FOOTER
         ===================================================== -->

    <footer>

        VOLTICA PREMIUM © 2026

    </footer>


</body>

</html>
