<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Voltica Store — premium technology, audio, gaming gear, creator gear, smart tech and lifestyle products."
    >

    <meta
        name="theme-color"
        content="#050505"
    >

    <title>Voltica Store</title>

    <link
        rel="stylesheet"
        href="style.css"
    >


    <!-- =====================================================
         VOLTICA STORE — ISOLATED INTERFACE OVERRIDES
         ===================================================== -->

    <style>

        /* =====================================================
           GLOBAL SAFETY
           ===================================================== */

        .store-page,
        .store-page * {
            box-sizing: border-box;
        }


        .store-page {
            position: relative;
            width: 100%;
            min-height: 100vh;
            overflow-x: hidden;
        }


        /* =====================================================
           STORE HEADER
           ===================================================== */

        .store-page .store-header {

            position: relative;

            width: 100%;

            min-height: 500px;

            display: flex;

            align-items: center;

            justify-content: center;

            padding:
                155px
                40px
                70px;

            text-align: center;

            overflow: visible;

            isolation: isolate;

        }


        .store-page .store-header-center {

            position: relative;

            z-index: 5;

            width: 100%;

            max-width: 1600px;

            display: flex;

            flex-direction: column;

            align-items: center;

            justify-content: center;

            margin: 0 auto;

        }


        .store-page .store-header .store-label {
            display: none !important;
        }


        /* =====================================================
           VOLTICA LOGO
           ===================================================== */

        .store-page .store-header-logo {

            display: block;

            width: min(420px, 58vw);

            max-width: 100%;

            height: auto;

            margin:
                0
                auto
                28px;

            object-fit: contain;

            filter:
                drop-shadow(
                    0 0 18px
                    rgba(255,255,255,0.12)
                )
                drop-shadow(
                    0 0 42px
                    rgba(110,150,255,0.08)
                );

            animation:
                volticaLogoFloat
                6s
                ease-in-out
                infinite;

            user-select: none;

            pointer-events: none;

        }


        @keyframes volticaLogoFloat {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-4px);
            }

        }


        /* =====================================================
           MAIN TITLE
           ===================================================== */

        .store-page .store-header h1 {

            display: block;

            width: 100%;

            margin: 0;

            padding: 0;

            font-size:
                clamp(
                    42px,
                    5.8vw,
                    96px
                );

            line-height: 0.98;

            font-weight: 300;

            letter-spacing:
                -0.045em;

            white-space: nowrap;

            text-align: center;

            color: #f5f7ff;

            text-shadow:
                0 0 18px
                rgba(255,255,255,0.08),

                0 0 45px
                rgba(130,150,255,0.10);

        }


        .store-page .store-header h1 span {

            color: #aab9ff;

            font-style: italic;

        }


        /* =====================================================
           EDGE NAVIGATION
           ===================================================== */

        .store-page .voltica-edge-nav {

            position: fixed;

            top: 24px;

            left: 24px;

            z-index: 5000;

            width: 160px;

            display: flex;

            flex-direction: column;

            align-items: stretch;

            gap: 10px;

            margin: 0;

            padding: 0;

        }


        /* =====================================================
           NAVIGATION WRAPPER
           ===================================================== */

        .store-page .voltica-store-navigation {

            position: relative;

            display: block;

            width: 160px;

            margin: 0;

            padding: 0;

        }


        /* =====================================================
           NAV BUTTON
           ===================================================== */

        .store-page .voltica-edge-button {

            position: relative;

            z-index: 2;

            width: 160px;

            min-width: 160px;

            height: 54px;

            min-height: 54px;

            max-height: 54px;

            margin: 0;

            padding:
                0
                16px;

            display: flex;

            flex-direction: row;

            align-items: center;

            justify-content: flex-start;

            gap: 11px;

            flex: 0 0 54px;

            overflow: hidden;

            border-radius: 15px;

            border:
                1px solid
                rgba(255,255,255,0.10);

            background:
                linear-gradient(
                    135deg,
                    rgba(255,255,255,0.065),
                    rgba(255,255,255,0.025)
                );

            backdrop-filter:
                blur(18px)
                saturate(130%);

            -webkit-backdrop-filter:
                blur(18px)
                saturate(130%);

            box-shadow:
                inset 0 1px 0
                rgba(255,255,255,0.08),

                0 10px 35px
                rgba(0,0,0,0.22);

            color:
                rgba(255,255,255,0.78);

            text-decoration: none;

            font-family: inherit;

            cursor: pointer;

            transition:
                transform 0.25s ease,
                border-color 0.25s ease,
                background 0.25s ease,
                box-shadow 0.25s ease;

        }


        .store-page a.voltica-edge-button:hover,
        .store-page button.voltica-edge-button:hover {

            transform:
                translateX(4px);

            border-color:
                rgba(150,180,255,0.28);

            background:
                linear-gradient(
                    135deg,
                    rgba(255,255,255,0.10),
                    rgba(110,140,255,0.045)
                );

            box-shadow:
                inset 0 1px 0
                rgba(255,255,255,0.10),

                0 12px 38px
                rgba(60,90,180,0.15);

        }


        /* =====================================================
           NAV DOT
           ===================================================== */

        .store-page .voltica-edge-dot {

            display: block;

            width: 7px;

            min-width: 7px;

            height: 7px;

            min-height: 7px;

            flex: 0 0 7px;

            margin: 0;

            border-radius: 50%;

            background:
                rgba(220,235,255,0.95);

            box-shadow:
                0 0 8px
                rgba(180,210,255,0.7);

        }


        /* =====================================================
           NAV LABEL
           ===================================================== */

        .store-page .voltica-edge-label {

            display: block;

            width: auto;

            margin: 0;

            padding: 0;

            overflow: hidden;

            text-overflow: ellipsis;

            white-space: nowrap;

            font-size: 9px;

            line-height: 1;

            font-weight: 700;

            letter-spacing:
                0.17em;

            color:
                rgba(255,255,255,0.82);

        }


        /* =====================================================
           CONTACT
           ===================================================== */

        .store-page .voltica-contact-button {

            width: 160px;

            min-width: 160px;

            height: 54px;

            min-height: 54px;

            max-height: 54px;

        }


        .store-page
        .voltica-contact-button
        .voltica-edge-dot {

            background:
                rgba(205,220,255,0.95);

            box-shadow:
                0 0 8px
                rgba(170,200,255,0.75);

        }


        /* =====================================================
           STORE DROPDOWN
           ===================================================== */

        .store-page .voltica-store-menu {

            position: absolute;

            top: calc(100% + 10px);

            left: 0;

            z-index: 6000;

            width: 245px;

            max-width: 245px;

            margin: 0;

            padding: 9px;

            border-radius: 18px;

            border:
                1px solid
                rgba(255,255,255,0.12);

            background:
                linear-gradient(
                    145deg,
                    rgba(25,28,38,0.94),
                    rgba(8,10,16,0.94)
                );

            backdrop-filter:
                blur(24px)
                saturate(140%);

            -webkit-backdrop-filter:
                blur(24px)
                saturate(140%);

            box-shadow:
                inset 0 1px 0
                rgba(255,255,255,0.08),

                0 24px 60px
                rgba(0,0,0,0.48);

            opacity: 0;

            visibility: hidden;

            pointer-events: none;

            transform:
                translateY(-8px)
                scale(0.97);

            transform-origin:
                top left;

            transition:
                opacity 0.22s ease,
                visibility 0.22s ease,
                transform 0.22s ease;

        }


        .store-page .voltica-store-menu.is-open {

            opacity: 1;

            visibility: visible;

            pointer-events: auto;

            transform:
                translateY(0)
                scale(1);

        }


        .store-page .voltica-store-menu-title {

            display: block;

            padding:
                9px
                12px
                8px;

            color:
                rgba(255,255,255,0.40);

            font-size: 8px;

            line-height: 1.2;

            font-weight: 700;

            letter-spacing:
                0.25em;

        }


        .store-page .voltica-store-menu a {

            display: grid;

            grid-template-columns:
                30px
                minmax(0,1fr);

            align-items: center;

            gap: 7px;

            width: 100%;

            min-height: 42px;

            margin: 0;

            padding:
                7px
                10px;

            border-radius: 11px;

            color:
                rgba(255,255,255,0.78);

            text-decoration: none;

            transition:
                background 0.2s ease,
                color 0.2s ease,
                transform 0.2s ease;

        }


        .store-page .voltica-store-menu a:hover {

            background:
                rgba(255,255,255,0.075);

            color: #ffffff;

            transform:
                translateX(3px);

        }


        .store-page .voltica-store-menu-number {

            font-size: 8px;

            line-height: 1;

            letter-spacing:
                0.16em;

            color:
                rgba(160,185,255,0.65);

        }


        .store-page .voltica-store-menu-name {

            font-size: 10px;

            line-height: 1.2;

            font-weight: 700;

            letter-spacing:
                0.13em;

        }


        /* =====================================================
           CATEGORY MENU
           ===================================================== */

        .store-page .store-categories {

            position: relative;

            z-index: 100;

            width: 100%;

            margin:
                0
                auto;

            padding:
                0
                30px;

        }


        .store-page .category-glass {

            position: relative;

            overflow: hidden;

        }


        .store-page .category-glass::after {

            content: "";

            position: absolute;

            top: 0;

            left: -120%;

            width: 70%;

            height: 100%;

            background:
                linear-gradient(
                    90deg,
                    transparent,
                    rgba(255,255,255,0.10),
                    transparent
                );

            transform:
                skewX(-20deg);

            transition:
                left 0.65s ease;

            pointer-events: none;

        }


        .store-page .category-glass:hover::after {

            left: 150%;

        }


        /* =====================================================
           PRODUCT CARD SAFETY
           ===================================================== */

        .store-page .store-product {

            position: relative;

            min-width: 0;

            overflow: visible;

        }


        .store-page .store-product .product-image {

            position: relative;

            width: 100%;

            overflow: hidden;

        }


        .store-page .store-product .product-image img {

            display: block;

            width: 100%;

            max-width: 100%;

            height: auto;

        }


        /* =====================================================
           PRODUCT BADGE
           ===================================================== */

        .store-page .store-product .product-badge {

            position: absolute;

            top: 18px;

            left: 18px;

            z-index: 20;

            display: inline-flex;

            align-items: center;

            justify-content: center;

            gap: 7px;

            min-height: 32px;

            width: auto;

            max-width: calc(100% - 36px);

            padding:
                7px
                12px;

            border-radius: 999px;

            border:
                1px solid
                rgba(255,255,255,0.20);

            background:
                linear-gradient(
                    135deg,
                    rgba(255,255,255,0.20),
                    rgba(255,255,255,0.065)
                );

            backdrop-filter:
                blur(15px)
                saturate(150%);

            -webkit-backdrop-filter:
                blur(15px)
                saturate(150%);

            box-shadow:
                inset 0 1px 0
                rgba(255,255,255,0.20),

                0 8px 25px
                rgba(0,0,0,0.22);

            color:
                rgba(255,255,255,0.96);

            font-size: 9px;

            font-weight: 800;

            letter-spacing:
                0.17em;

            line-height: 1;

            white-space: nowrap;

            animation:
                badgePulse
                2.8s
                ease-in-out
                infinite;

        }


        .store-page .store-product .product-badge::before {

            content: "✦";

            display: inline-block;

            font-size: 10px;

            color: #ffffff;

            text-shadow:
                0 0 7px
                rgba(190,215,255,0.95),

                0 0 14px
                rgba(130,165,255,0.70);

            animation:
                badgeStarPulse
                1.8s
                ease-in-out
                infinite;

        }


        @keyframes badgePulse {

            0%,
            100% {

                box-shadow:
                    inset 0 1px 0
                    rgba(255,255,255,0.20),

                    0 8px 25px
                    rgba(0,0,0,0.22);

            }

            50% {

                box-shadow:
                    inset 0 1px 0
                    rgba(255,255,255,0.28),

                    0 0 18px
                    rgba(140,175,255,0.20),

                    0 10px 30px
                    rgba(0,0,0,0.26);

            }

        }


        @keyframes badgeStarPulse {

            0%,
            100% {

                opacity: 0.65;

                transform:
                    scale(0.9)
                    rotate(0deg);

            }

            50% {

                opacity: 1;

                transform:
                    scale(1.25)
                    rotate(12deg);

            }

        }


        /* =====================================================
           PRODUCT BUTTON SAFETY
           ===================================================== */

        .store-page .product-bottom {

            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 18px;

            width: 100%;

            min-width: 0;

        }


        .store-page .product-button {

            position: relative;

            z-index: 5;

            flex:
                0
                0
                auto;

            white-space: nowrap;

            text-decoration: none;

        }


        /* =====================================================
           TABLET
           ===================================================== */

        @media (max-width: 1100px) {

            .store-page .store-header {

                min-height: 450px;

                padding:
                    145px
                    30px
                    60px;

            }


            .store-page .store-header-logo {

                width:
                    min(360px, 55vw);

            }


            .store-page .store-header h1 {

                font-size:
                    clamp(
                        38px,
                        6vw,
                        72px
                    );

            }


            .store-page .voltica-edge-nav {

                top: 18px;

                left: 18px;

            }

        }


        /* =====================================================
           MOBILE
           ===================================================== */

        @media (max-width: 700px) {

            .store-page .voltica-edge-nav {

                position: absolute;

                top: 12px;

                left: 10px;

                width: 135px;

                gap: 7px;

            }


            .store-page .voltica-store-navigation {

                width: 135px;

            }


            .store-page .voltica-edge-button {

                width: 135px;

                min-width: 135px;

                height: 44px;

                min-height: 44px;

                max-height: 44px;

                flex-b
