       HEADER — GRAPHITE TINTED GLASS SYSTEM

    .store-header {

    }

    .store-header::before {
        content: "" !important;
        position: absolute !important;
        top: 0 !important;
        left: 0 !important;
        right: 0 !important;
        height: 1px !important;

    }

    .store-header .logo-acrylic {
        display: flex !important;
        align-items: center !important;
        gap: 12px !important;
        text-decoration: none !important;
        z-index: 1001 !important;

    }

    .store-header .logo-text {

        font-weight: 700 !important;

    /* Desktop Navigation */

        display: flex !important;

        gap: 32px !important;
    }

    .store-header .store-nav a {
        text-decoration: none !important;
        color: rgba(255, 255, 255, 0.65) !important;
        font-size: 11px !important;
        font-weight: 600 !important;
        letter-spacing: 0.12em !important;
        transition: color 0.3s ease !important;
        position: relative !important;
        padding: 4px 0 !important;
    }

    .store-header .store-nav a:hover,
    .store-header .store-nav a.nav-active {
        color: #fff !important;
    }

    .store-header .store-nav a.nav-active::after {
        content: "" !important;
        position: absolute !important;
        bottom: -2px !important;
        left: 0 !important;
        right: 0 !important;
        height: 1px !important;
        background: #fff !important;
        opacity: 0.6 !important;
    }

    /* Mobile Menu Toggle */
    .store-header .mobile-menu-toggle {
        display: none !important;
        flex-direction: column !important;
        justify-content: center !important;
        gap: 5px !important;
        width: 32px !important;
        height: 32px !important;
        background: transparent !important;
        border: none !important;
        cursor: pointer !important;
        padding: 4px !important;
        z-index: 1001 !important;

    .store-header .hamburger-line {

        width: 100% !important;
        height: 1.5px !important;
        background: #fff !important;
        border-radius: 2px !important;
        transition: all 0.3s ease !important;
        transform-origin: center !important;
    }

    .store-header .mobile-menu-toggle[aria-expanded="true"] .hamburger-line:nth-child(1) {
        transform: translateY(6.5px) rotate(45deg) !important;
    }

    .store-header .mobile-menu-toggle[aria-expanded="true"] .hamburger-line:nth-child(2) {
        opacity: 0 !important;
    }

    .store-header .mobile-menu-toggle[aria-expanded="true"] .hamburger-line:nth-child(3) {
        transform: translateY(-6.5px) rotate(-45deg) !important;
    }

    /* Mobile Nav Link with Pulsar Dot */

        display: flex !important;
        align-items: center !important;
        gap: 14px !important;
        text-decoration: none !important;

            opacity: 0.6 !important;
            box-shadow: 0 0 8px #fff, 0 0 16px rgba(255, 255, 255, 0.3) !important;

<script>
    document.addEventListener('DOMContentLoaded', function() {
        // Mobile Menu Logic
        const menuToggle = document.getElementById('mobileMenuToggle');
        const mobileMenu = document.getElementById('mobileMenu');
        
        if (menuToggle && mobileMenu) {
            menuToggle.addEventListener('click', function() {
                const isExpanded = menuToggle.getAttribute('aria-expanded') === 'true';
                menuToggle.setAttribute('aria-expanded', !isExpanded);
                mobileMenu.classList.toggle('mobile-open');
            });
            
            const navLinks = mobileMenu.querySelectorAll('a');
            navLinks.forEach(link => {
                link.addEventListener('click', () => {
                    mobileMenu.classList.remove('mobile-open');
                    menuToggle.setAttribute('aria-expanded', 'false');
                });
            });
        }
    });
</script>
