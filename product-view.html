<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voltica Store — Device Details</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<main class="store-page" style="padding: 120px 25px 80px;">

    <div style="max-width: 1100px; margin: 0 auto;">
        <a href="store.html" class="product-button" style="margin-bottom: 50px; display: inline-flex;">
            <span>←</span> BACK TO STOREFRONT
        </a>

        <div id="productDetailContainer">
            <!-- Dynamic Injection -->
        </div>
    </div>

</main>

<script src="products.js"></script>
<script>
document.addEventListener("DOMContentLoaded", function () {
    const params = new URLSearchParams(window.location.search);
    const id = params.get('id');
    const product = getProductById(id);
    const container = document.getElementById('productDetailContainer');

    if (!product) {
        container.innerHTML = `
            <div style="text-align: center; padding: 100px 0;">
                <h2 style="font-weight: 300; font-size: 32px;">Device Not Found</h2>
                <p style="color: rgba(255,255,255,0.4); margin-top: 10px;">The requested product catalog entry does not exist.</p>
            </div>
        `;
        return;
    }

    container.innerHTML = `
        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 60px; align-items: start;">
            <div class="store-product" style="border-radius: 28px;">
                <div class="product-image" style="aspect-ratio: 1/1;">
                    ${product.badge ? `<span class="product-badge">${product.badge}</span>` : ''}
                    <img src="${product.imageUrl}" alt="${product.name}">
                    <div class="image-reflection"></div>
                </div>
            </div>

            <div>
                <span class="section-index">VOLTICA / ${product.category.toUpperCase()}</span>
                <h1 style="font-size: clamp(32px, 4vw, 54px); font-weight: 300; line-height: 1.05; margin: 15px 0 20px;">
                    ${product.name}
                </h1>
                
                <p style="color: rgba(255,255,255,0.65); font-size: 14px; line-height: 1.8; margin-bottom: 35px; white-space: pre-line;">
                    ${product.description}
                </p>

                <div style="padding-top: 25px; border-top: 1px solid rgba(255,255,255,0.08);">
                    <div style="font-size: 36px; font-weight: 300; color: #fff; margin-bottom: 25px;">
                        $${parseFloat(product.price).toFixed(2)} <span style="font-size: 12px; color: rgba(255,255,255,0.4); letter-spacing: 0.15em;">USD</span>
                    </div>

                    <a href="${product.stripeUrl}" target="_blank" class="product-button" style="width: 100%; height: 58px; font-size: 11px; letter-spacing: 0.2em; justify-content: center;">
                        CHECKOUT WITH STRIPE <span>→</span>
                    </a>
                </div>
            </div>
        </div>
    `;
});
</script>

</body>
</html>
