<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Voltica Store — Premium technology. The future of everyday.">
    <meta name="theme-color" content="#030303">
    <title>Voltica Store — The Future of Everyday</title>

    <link rel="stylesheet" href="store.css">
    <link rel="stylesheet" href="index.css">

    <style>
        :root {
            --black: #030303;
            --glass: rgba(255, 255, 255, 0.045);
            --glass-strong: rgba(255, 255, 255, 0.075);
            --border: rgba(255, 255, 255, 0.12);
            --white: #ffffff;
            --muted: rgba(255, 255, 255, 0.58);
            --soft: rgba(255, 255, 255, 0.32);
        }

        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            background: #030303;
            color: #fff;
            overflow-x: hidden;
        }

        /* =================================================
           AMBIENT SYSTEM
           ================================================= */
        .voltica-ambient {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .ambient-orb {
            position: absolute;
            width: 420px;
            height: 420px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.08), transparent 68%);
            filter: blur(25px);
            animation: ambientFloat 12s ease-in-out infinite;
        }

        .ambient-orb.one {
            top: 8%;
            left: -180px;
        }

        .ambient-orb.two {
            top: 48%;
            right: -180px;
            animation-delay: -4s;
        }

        .ambient-orb.three {
            bottom: -200px;
            left: 35%;
            animation-delay: -8s;
        }

        @keyframes ambientFloat {
            0%,
            100% {
                transform: translate3d(0, 0, 0);
                opacity: 0.45;
            }
            50% {
                transform: translate3d(50px, -35px, 0);
                opacity: 0.8;
            }
        }

        /* =================================================
           PULSE POINTS
           ================================================= */
        .pulse-network {
            position: absolute;
            inset: 0;
            pointer-events: none;
        }

        .pulse-point {
            position: absolute;
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: #fff;
            box-shadow: 0 0 8px rgba(255, 255, 255, 0.9), 0 0 28px rgba(255, 255, 255, 0.45);
            animation: pulsePoint 3s ease-in-out infinite;
        }

        .pulse-point::after {
            content: "";
            position: absolute;
            inset: -9px;
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 50%;
            animation: pulseRing 3s ease-out infinite;
        }

        .pp1 {
            top: 17%;
            left: 12%;
        }

        .pp2 {
            top: 31%;
            right: 15%;
            animation-delay: -0.8s;
        }

        .pp3 {
            top: 58%;
            left: 8%;
            animation-delay: -1.6s;
        }

        .pp4 {
            top: 72%;
            right: 11%;
            animation-delay: -2.3s;
        }

        .pp5 {
            top: 89%;
            left: 44%;
            animation-delay: -1.1s;
        }

        @keyframes pulsePoint {
            0%,
            100% {
                transform: scale(0.75);
                opacity: 0.35;
            }
            50% {
                transform: scale(1.45);
                opacity: 1;
            }
        }

        @keyframes pulseRing {
            0% {
                transform: scale(0.4);
                opacity: 0.8;
            }
            100% {
                transform: scale(2.5);
                opacity: 0;
            }
        }

        /* =================================================
           HERO — RÉDUITE
           ================================================= */
        .premium-home {
            position: relative;
            z-index: 2;
            min-height: 480px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 100px 24px 50px;
            overflow: hidden;
        }

        .hero-glass {
            position: relative;
            width: min(1180px, 100%);
            min-height: 360px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 50px;
            border: 1px solid var(--border);
            border-radius: 42px;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.075), rgba(255, 255, 255, 0.018));
            backdrop-filter: blur(35px);
            -webkit-backdrop-filter: blur(35px);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.1), 0 40px 120px rgba(0, 0, 0, 0.65);
            overflow: hidden;
        }

        .hero-glass::before {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(120deg, transparent 20%, rgba(255, 255, 255, 0.08), transparent 45%);
            transform: translateX(-120%);
            animation: glassSweep 8s ease-in-out infinite;
            pointer-events: none;
        }

        @keyframes glassSweep {
            0%,
            55% {
                transform: translateX(-120%);
            }
            75%,
            100% {
                transform: translateX(120%);
            }
        }

        .hero-copy {
            position: relative;
            z-index: 3;
            width: 100%;
            max-width: 900px;
            text-align: center;
        }

        .hero-kicker {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 7px 14px;
            border: 1px solid rgba(255, 255, 255, 0.13);
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.045);
            color: rgba(255, 255, 255, 0.7);
            font-size: 9px;
            letter-spacing: 0.22em;
        }

        .hero-kicker-dot {
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: #fff;
            box-shadow: 0 0 14px #fff;
            animation: pulsePoint 2s infinite;
        }

        .hero-copy h1 {
            margin: 12px 0 0;
            font-size: clamp(38px, 6vw, 72px);
            line-height: 0.86;
            letter-spacing: -0.07em;
            font-weight: 800;
        }

        .hero-copy h1 span {
            display: block;
        }

        .hero-copy h1 span:last-child {
            color: rgba(255, 255, 255, 0.35);
        }

        .hero-copy p {
            max-width: 600px;
            margin: 14px auto 0;
            color: var(--muted);
            font-size: 14px;
            line-height: 1.7;
        }

        .hero-actions {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            margin-top: 20px;
        }

        .hero-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 44px;
            padding: 0 20px;
            border: 1px solid rgba(255, 255, 255, 0.16);
            border-radius: 16px;
            text-decoration: none;
            color: #fff;
            background: rgba(255, 255, 255, 0.07);
            backdrop-filter: blur(15px);
            transition: 0.35s ease;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.04em;
        }

        .hero-button:hover {
            transform: translateY(-3px);
            background: rgba(255, 255, 255, 0.14);
            box-shadow: 0 15px 40px rgba(255, 255, 255, 0.08);
        }

        .hero-button.primary {
            background: #fff;
            color: #050505;
            font-weight: 700;
        }

        /* =================================================
           FEATURE VIDEO
           ================================================= */
        .index-video-section {
            position: relative;
            z-index: 3;
            padding: 10px 24px 40px;
        }

        .index-video-container {
            width: min(1100px, 100%);
            margin: auto;
        }

        .index-video-frame {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.14);
            border-radius: 32px;
            background: #000;
            box-shadow: 0 35px 100px rgba(0, 0, 0, 0.65);
        }

        .index-video-frame::before {
            content: "";
            position: absolute;
            inset: 0;
            z-index: 2;
            pointer-events: none;
            border-radius: inherit;
            box-shadow: inset 0 0 70px rgba(255, 255, 255, 0.035);
        }

        .index-video-frame video {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* =================================================
           Q45 PROMOTIONAL CTA
           ================================================= */
        .q45-promo-section {
            position: relative;
            z-index: 3;
            padding: 10px 24px 60px;
        }

        .q45-promo-card {
            position: relative;
            width: min(1080px, 100%);
            min-height: 300px;
            margin: auto;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            border-radius: 34px;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.09), rgba(255, 255, 255, 0.025));
            border: 1px solid rgba(255, 255, 255, 0.14);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            box-shadow: 0 35px 100px rgba(0, 0, 0, 0.65), inset 0 1px 0 rgba(255, 255, 255, 0.1);
        }

        .q45-promo-card::before {
            content: "";
            position: absolute;
            inset: 7px;
            border-radius: 28px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 0 8px rgba(255, 255, 255, 0.04), inset 0 0 8px rgba(255, 255, 255, 0.025);
            pointer-events: none;
            z-index: 5;
        }

        .q45-promo-card::after {
            content: "";
            position: absolute;
            top: 0;
            left: 18%;
            width: 64%;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.7), transparent);
            box-shadow: 0 0 12px rgba(255, 255, 255, 0.3);
            opacity: 0.65;
            pointer-events: none;
            z-index: 6;
            animation: promoLight 5s ease-in-out infinite;
        }

        @keyframes promoLight {
            0%,
            100% {
                opacity: 0.25;
                transform: scaleX(0.7);
            }
            50% {
                opacity: 0.75;
                transform: scaleX(1);
            }
        }

        .q45-promo-copy {
            position: relative;
            z-index: 4;
            width: 100%;
            max-width: 820px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 40px 40px;
        }

        .q45-promo-label {
            display: inline-flex;
            align-items: center;
            gap: 9px;
            width: max-content;
            margin-bottom: 12px;
            color: rgba(255, 255, 255, 0.52);
            font-size: 9px;
            letter-spacing: 0.22em;
        }

        .q45-promo-label::before {
            content: "";
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #fff;
            box-shadow: 0 0 12px rgba(255, 255, 255, 0.8);
        }

        .q45-promo-copy h2 {
            margin: 0;
            font-size: clamp(36px, 5vw, 60px);
            line-height: 0.92;
            letter-spacing: -0.06em;
        }

        .q45-promo-copy h2 span {
            display: block;
            color: rgba(255, 255, 255, 0.38);
        }

        .q45-promo-description {
            max-width: 560px;
            margin: 14px auto 18px;
            color: var(--muted);
            font-size: 13px;
            line-height: 1.7;
        }

        .q45-price-row {
            display: flex;
            align-items: flex-end;
            justify-content: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 18px;
        }

        .q45-price {
            font-size: clamp(32px, 4.5vw, 48px);
            line-height: 0.9;
            font-weight: 800;
            letter-spacing: -0.06em;
        }

        .q45-price small {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.42);
            letter-spacing: 0.08em;
            margin-left: 5px;
        }

        .q45-lifetime-badge {
            padding: 6px 12px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.06);
            color: #fff;
            font-size: 8px;
            font-weight: 700;
            letter-spacing: 0.14em;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.05);
        }

        .q45-promo-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: max-content;
            min-height: 48px;
            padding: 0 24px;
            border-radius: 16px;
            background: #fff;
            color: #050505;
            text-decoration: none;
            font-size: 11px;
            font-weight: 800;
            letter-spacing: 0.08em;
            transition: 0.35s ease;
        }

        .q45-promo-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 18px 45px rgba(255, 255, 255, 0.15);
        }

        /* =================================================
           15% OFF FOR LIFE
           ================================================= */
        .lifetime-section {
            position: relative;
            z-index: 3;
            padding: 10px 24px 80px;
        }

        .lifetime-card {
            position: relative;
            width: min(1050px, 100%);
            margin: auto;
            padding: 38px 45px;
            display: grid;
            grid-template-columns: 100px 1fr auto;
            align-items: center;
            gap: 24px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 30px;
            background: linear-gradient(120deg, rgba(255, 255, 255, 0.1), rgba(255, 255, 255, 0.025));
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            box-shadow: 0 25px 90px rgba(0, 0, 0, 0.55), inset 0 1px 0 rgba(255, 255, 255, 0.12);
            overflow: hidden;
        }

        .lifetime-card::after {
            content: "";
            position: absolute;
            width: 220px;
            height: 220px;
            right: -100px;
            top: -100px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.18), transparent 70%);
            filter: blur(12px);
        }

        .lifetime-card-icon {
            width: 80px;
            height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 22px;
            background: rgba(255, 255, 255, 0.07);
            font-size: 32px;
            animation: cardPulse 3s ease-in-out infinite;
        }

        @keyframes cardPulse {
            0%,
            100% {
                box-shadow: 0 0 20px rgba(255, 255, 255, 0.04);
            }
            50% {
                box-shadow: 0 0 45px rgba(255, 255, 255, 0.16);
            }
        }

        .lifetime-copy span {
            display: block;
            margin-bottom: 6px;
            color: rgba(255, 255, 255, 0.45);
            font-size: 9px;
            letter-spacing: 0.2em;
        }

        .lifetime-copy h2 {
            margin: 0;
            font-size: clamp(22px, 3.5vw, 38px);
            letter-spacing: -0.04em;
        }

        .lifetime-copy p {
            margin: 8px 0 0;
            color: var(--muted);
            line-height: 1.6;
            font-size: 13px;
        }

        .lifetime-number {
            position: relative;
            z-index: 2;
            text-align: center;
        }

        .lifetime-number strong {
            display: block;
            font-size: clamp(32px, 4.5vw, 52px);
            line-height: 1;
        }

        .lifetime-number span {
            color: rgba(255, 255, 255, 0.45);
            font-size: 8px;
            letter-spacing: 0.18em;
        }

        /* =================================================
           COLLECTION
           ================================================= */
        .collection-section {
            position: relative;
            z-index: 3;
            padding: 80px 24px;
        }

        .collection-container {
            width: min(1180px, 100%);
            margin: auto;
        }

        .collection-heading {
            max-width: 700px;
            margin-bottom: 45px;
        }

        .collection-heading span {
            color: rgba(255, 255, 255, 0.4);
            font-size: 9px;
            letter-spacing: 0.22em;
        }

        .collection-heading h2 {
            margin: 12px 0 0;
            font-size: clamp(32px, 5vw, 60px);
            letter-spacing: -0.06em;
        }

        .collection-heading p {
            color: var(--muted);
            line-height: 1.8;
            font-size: 14px;
        }

        .collection-grid {
            display: grid;
            grid-template-columns: 1.35fr 0.65fr;
            gap: 18px;
        }

        .collection-card {
            position: relative;
            min-height: 320px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 30px;
            background: rgba(255, 255, 255, 0.035);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }

        .collection-card.large {
            min-height: 480px;
        }

        .collection-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.8s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        .collection-card:hover img {
            transform: scale(1.06);
        }

        .collection-overlay {
            position: absolute;
            inset: auto 0 0;
            padding: 24px 28px;
            background: linear-gradient(transparent, rgba(0, 0, 0, 0.9));
        }

        .collection-overlay span {
            color: rgba(255, 255, 255, 0.5);
            font-size: 8px;
            letter-spacing: 0.2em;
        }

        .collection-overlay h3 {
            margin: 6px 0 0;
            font-size: 24px;
        }

        .collection-side {
            display: grid;
            grid-template-rows: 1fr 1fr;
            gap: 18px;
        }

        /* =================================================
           FINAL CTA
           ================================================= */
        .final-section {
            position: relative;
            z-index: 3;
            padding: 60px 24px 100px;
        }

        .final-glass {
            width: min(1000px, 100%);
            margin: auto;
            padding: 60px 30px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.13);
            border-radius: 38px;
            background: linear-gradient(145deg, rgba(255, 255, 255, 0.08), rgba(255, 255, 255, 0.02));
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            box-shadow: 0 40px 100px rgba(0, 0, 0, 0.55);
        }

        .final-glass .pulse-dot {
            display: inline-block;
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #fff;
            box-shadow: 0 0 25px #fff;
            animation: pulsePoint 2s infinite;
        }

        .final-glass h2 {
            margin: 18px 0 12px;
            font-size: clamp(30px, 5vw, 55px);
            letter-spacing: -0.06em;
        }

        .final-glass p {
            max-width: 520px;
            margin: 0 auto 24px;
            color: var(--muted);
            line-height: 1.7;
            font-size: 14px;
        }

        /* =================================================
           CONTACT SECTION
           ================================================= */
        .contact-section {
            position: relative;
            z-index: 3;
            padding: 20px 24px 80px;
        }

        .contact-acrylic {
            position: relative;
            width: min(900px, 100%);
            margin: auto;
            padding: 50px 40px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 30px;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.06), rgba(255, 255, 255, 0.015));
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            overflow: hidden;
        }

        .contact-pulsar {
            position: absolute;
            width: 300px;
            height: 300px;
            top: -150px;
            right: -150px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.06), transparent 70%);
            pointer-events: none;
        }

        .contact-label {
            display: inline-block;
            padding: 6px 14px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 999px;
            color: rgba(255, 255, 255, 0.5);
            font-size: 8px;
            letter-spacing: 0.2em;
        }

        .contact-content h2 {
            margin: 14px 0 6px;
            font-size: clamp(28px, 4vw, 44px);
            letter-spacing: -0.04em;
        }

        .contact-content p {
            color: rgba(255, 255, 255, 0.5);
            font-size: 13px;
        }

        .contact-button {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            margin-top: 18px;
            padding: 12px 24px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 16px;
            color: #fff;
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 0.08em;
            transition: 0.3s ease;
            background: rgba(255, 255, 255, 0.04);
        }

        .contact-button:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: translateY(-2px);
        }

        .contact-button strong {
            font-size: 16px;
        }

        /* =================================================
           CART DRAWER
           ================================================= */
        .voltica-cart-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.72);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.35s ease, visibility 0.35s ease;
            z-index: 9998;
        }

        .voltica-cart-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .voltica-cart-drawer {
            position: fixed;
            top: 0;
            right: 0;
            bottom: 0;
            width: min(430px, 92vw);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            background: linear-gradient(145deg, rgba(25, 25, 25, 0.96), rgba(5, 5, 5, 0.98));
            border-left: 1px solid rgba(255, 255, 255, 0.14);
            box-shadow: -30px 0 100px rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            transform: translateX(105%);
            transition: transform 0.45s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        .voltica-cart-drawer.active {
            transform: translateX(0);
        }

        .voltica-cart-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 24px 24px 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.09);
        }

        .voltica-cart-brand {
            display: block;
            color: rgba(255, 255, 255, 0.4);
            font-size: 8px;
            letter-spacing: 0.2em;
        }

        .voltica-cart-header h2 {
            margin: 4px 0 0;
            font-size: 24px;
            letter-spacing: -0.04em;
        }

        .voltica-cart-close {
            width: 40px;
            height: 40px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
            font-size: 24px;
            cursor: pointer;
            transition: 0.3s ease;
        }

        .voltica-cart-close:hover {
