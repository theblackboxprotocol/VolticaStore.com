
<!DOCTYPE html>
<html lang="en">
<head>
    <a href="store.html" class="store-header-button">

    <span class="store-logo-mark">V</span>

    <span class="store-header-text">
        <small>VOLTICA</small>
        <strong>STORE</strong>
    </span>

    <span class="store-header-arrow">→</span>

    </a>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Voltica Store</title>

    <meta
        name="description"
        content="Voltica Premium — The future of everyday."
    >

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background: #000;
            color: #fff;
            font-family: Arial, Helvetica, sans-serif;
            overflow-x: hidden;
        }

        /* =========================
           HERO
        ========================= */

        .hero {
            position: relative;
            width: 100%;
            height: 100svh;
            min-height: 650px;
            overflow: hidden;
            background: #000;
        }

        .hero-video {
            position: absolute;
            inset: 0;

            width: 100%;
            height: 100%;

            object-fit: cover;
        }

        .hero-overlay {
            position: absolute;
            inset: 0;

            background:
                linear-gradient(
                    to bottom,
                    rgba(0,0,0,0.15) 0%,
                    rgba(0,0,0,0.25) 45%,
                    rgba(0,0,0,0.90) 100%
                );
        }

        .hero-content {
            position: absolute;
            z-index: 5;

            left: 50%;
            bottom: 8%;

            transform: translateX(-50%);

            width: min(900px, 92%);

            display: flex;
            flex-direction: column;
            align-items: center;

            text-align: center;
        }

        .logo {
            width: min(420px, 72vw);
            height: auto;

            margin-bottom: 22px;

            filter:
                drop-shadow(0 0 20px rgba(255,255,255,0.12))
                drop-shadow(0 20px 45px rgba(0,0,0,0.8));
        }

        .tagline {
            font-size: 12px;
            letter-spacing: 7px;
            text-transform: uppercase;

            color: rgba(255,255,255,0.78);

            margin-bottom: 30px;
        }

        .preorder {
            display: inline-flex;
            align-items: center;
            justify-content: center;

            padding: 17px 34px;

            border: 1px solid rgba(255,255,255,0.55);
            border-radius: 4px;

            background: rgba(255,255,255,0.08);

            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);

            color: white;
            text-decoration: none;

            font-size: 12px;
            font-weight: 600;

            letter-spacing: 3px;

            transition:
                transform 0.3s ease,
                background 0.3s ease,
                box-shadow 0.3s ease;
        }

        .preorder:hover {
            transform: translateY(-3px);

            background: rgba(255,255,255,0.16);

            box-shadow:
                0 15px 50px rgba(255,255,255,0.12);
        }


        /* =========================
           PRODUCT SECTION
        ========================= */

        .product-section {
            position: relative;

            padding: 110px 20px;

            background:
                radial-gradient(
                    circle at 50% 0%,
                    rgba(255,255,255,0.08),
                    transparent 45%
                ),
                #030303;
        }

        .section-label {
            text-align: center;

            font-size: 11px;
            letter-spacing: 5px;

            color: rgba(255,255,255,0.45);

            margin-bottom: 18px;
        }

        .section-title {
            text-align: center;

            font-size: clamp(32px, 6vw, 68px);
            font-weight: 300;

            letter-spacing: -2px;

            margin-bottom: 60px;
        }

        .product-video {
            display: block;

            width: min(1100px, 100%);
            max-height: 720px;

            margin: auto;

            object-fit: cover;

            border-radius: 12px;

            border: 1px solid rgba(255,255,255,0.10);

            box-shadow:
                0 30px 100px rgba(0,0,0,0.8);
        }


        /* =========================
           PREORDER
        ========================= */

        .preorder-section {
            min-height: 500px;

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

            text-align: center;

            padding: 100px 20px;

            background: #000;
        }

        .preorder-section h2 {
            font-size: clamp(35px, 7vw, 75px);
            font-weight: 300;

            margin-bottom: 20px;
        }

        .preorder-section p {
            max-width: 600px;

            color: rgba(255,255,255,0.55);

            line-height: 1.7;

            margin-bottom: 35px;
        }


        /* =========================
           FOOTER
        ========================= */

        footer {
            padding: 35px 20px;

            text-align: center;

            border-top: 1px solid rgba(255,255,255,0.08);

            color: rgba(255,255,255,0.35);

            font-size: 10px;
            letter-spacing: 3px;
        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 600px) {

            .hero {
                min-height: 700px;
            }

            .hero-content {
                bottom: 7%;
            }

            .logo {
                width: 82vw;
            }

            .tagline {
                font-size: 9px;
                letter-spacing: 4px;
            }

            .preorder {
                width: 85%;
                padding: 17px 20px;
            }

            .product-section {
                padding: 80px 15px;
            }

        }

    </style>
</head>

<body>


    <!-- =========================
         HERO
    ========================== -->

    <section class="hero">

        <video
            class="hero-video"
            autoplay
            muted
            loop
            playsinline
            preload="metadata">

            <source
                src="317a572754805f82f4051fe7fb3414ef.mp4"
                type="video/mp4">

        </video>

        <div class="hero-overlay"></div>

        <div class="hero-content">

            <img
                src="voltica_logo_face.png"
                alt="Voltica Premium"
                class="logo">

            <div class="tagline">
                The Future of Everyday
            </div>

            <a
                href="#preorder"
                class="preorder">

                PRE-ORDER — AUGUST 21ST

            </a>

        </div>

    </section>



    <!-- =========================
         PRODUCT
    ========================== -->

    <section class="product-section">

        <div class="section-label">
            VOLTICA PREMIUM
        </div>

        <h2 class="section-title">
            Designed to stand out.
        </h2>


        <video
            class="product-video"
            autoplay
            muted
            loop
            playsinline
            controls
            preload="metadata">

            <source
                src="FB_VID_6898437286649732159.mp4"
                type="video/mp4">

        </video>

    </section>



    <!-- =========================
         PREORDER
    ========================== -->

    <section
        class="preorder-section"
        id="preorder">

        <div class="section-label">
            VOLTICA STORE
        </div>

        <h2>
            Your next favorite.
        </h2>

        <p>
            Premium design. Smart technology.
            Made to stand out from the ordinary.
        </p>

        <a
            href="product.html"
            class="preorder">

            PRE-ORDER — AUGUST 21ST

        </a>

    </section>



    <footer>

        VOLTICA PREMIUM © 2026

    </footer>


</body>
</html>
