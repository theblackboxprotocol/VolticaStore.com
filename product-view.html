        .product-view-page {

                    transparent 35%

        }

           TOP NAVIGATION
           ===================================================== */

            position: fixed;

            top: 22px;
            left: 18px;

            z-index: 1000;

            display: flex;
            flex-direction: column;

            gap: 10px;

        }

            gap: 10px;

                rgba(255,255,255,0.82);

            font-size: 9px;

            font-weight: 700;

            letter-spacing:
                0.20em;

                transform 0.25s ease,
                border-color 0.25s ease,
                background 0.25s ease;
