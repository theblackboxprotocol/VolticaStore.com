<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Voltica Store</title>

    <link
        rel="stylesheet"
        href="style.css">

</head>

<body>

<main id="productView" class="dynamic-product-page">

    <div class="product-loading">
        LOADING PRODUCT...
    </div>

</main>


<!-- IMPORTANT : products.js DOIT être chargé avant le script -->
<script src="products.js"></script>


<script>

document.addEventListener("DOMContentLoaded", function () {


    /* =====================================================
       GET PRODUCT ID FROM URL
       ===================================================== */

    const params =
        new URLSearchParams(
            window.location.search
        );

    const productId =
        params.get("id");


    /* =====================================================
       FIND PRODUCT
       ===================================================== */

    const product =
        volticaProducts.find(
            item => item.id === productId
        );


    const container =
        document.getElementById(
            "productView"
        );


    /* =====================================================
       PRODUCT NOT FOUND
       ===================================================== */

    if (!product) {

        container.innerHTML = `

            <section class="product-not-found">

                <span>404</span>

                <h1>
                    Product not found.
                </h1>

                <a href="store.html">
                    RETURN TO STORE
                </a>

            </section>

        `;

        return;
    }


    /* =====================================================
       PAGE TITLE
       ===================================================== */

    document.title =
        `${product.name} — Voltica Store`;


    /* =====================================================
       PRODUCT DATA
       ===================================================== */

    const images =
        product.images || [product.image];


    const features =
        product.features || [];


    const specifications =
        product.specifications || [];


    /* =====================================================
       BUILD PRODUCT PAGE
       ===================================================== */

    container.innerHTML = `


        <!-- =================================================
             HERO
             ================================================= -->

        <section class="dynamic-product-hero">


            <!-- =============================================
                 GALLERY
                 ============================================= -->

            <div class="dynamic-gallery">


                <div class="dynamic-main-image">

                    <span class="dynamic-badge">
                        ${product.badge || "NEW"}
                    </span>


                    <img
                        id="mainProductImage"
                        src="${images[0]}"
                        alt="${product.name}">

                </div>


                <!-- =========================================
                     GLASS THUMBNAILS
                     ========================================= -->

                <div class="voltica-glass-gallery">


                    ${images.map((image, index) => `

                        <button
                            type="button"
                            class="voltica-thumb ${
                                index === 0
                                    ? "active"
                                    : ""
                            }"
                            onclick="
                                changeProductImage(
                                    this,
                                    '${image}'
                                )
                            ">

                            <img
                                src="${image}"
                                alt="${product.name} ${index + 1}">

                            <span>
                                ${String(index + 1).padStart(2, "0")}
                            </span>

                        </button>

                    `).join("")}


                </div>

            </div>



            <!-- =============================================
                 PRODUCT INFORMATION
                 ============================================= -->

            <div class="dynamic-product-info">


                <span class="dynamic-category">

                    VOLTICA /
                    ${product.category}

                </span>



                <!-- =========================================
                     TECH TITLE
                     ========================================= -->

                <div class="q17-title-tech">

                    <span
                        class="q17-title-status">
                    </span>

                    <span
                        class="q17-title-label">

                        VOLTICA /
                        ${product.name}

                    </span>


                    <h1>
                        ${product.name}
                    </h1>

                </div>



                <!-- =========================================
                     SUBTITLE
                     ========================================= -->

                <div class="q17-subtitle-glass">

                    <span
                        class="q17-subtitle-line">
                    </span>

                    <h2>

                        Wireless freedom.

                        <span>
                            Built to move.
                        </span>

                    </h2>

                </div>



                <!-- =========================================
                     DESCRIPTION
                     ========================================= -->

                <div
                    class="q17-description-card">


                    <div
                        class="q17-description-top">

                        <span>
                            VOLTICA /
                            PRODUCT INSIGHT
                        </span>

                        <i></i>

                    </div>


                    <p>
                        ${product.description}
                    </p>


                    <div
                        class="q17-description-bottom">

                        <span>
                            ${product.category}
                        </span>

                        <span>
                            QUALITY SELECTED
                        </span>

                        <span>
                            VOLTICA
                        </span>

                    </div>

                </div>



                <!-- =========================================
                     PURCHASE
                     ========================================= -->

                <div
                    class="q17-purchase-zone">


                    <div
                        class="q17-price-glass">


                        <span
                            class="q17-price-label">

                            ${product.name}
                            / PRICE

                        </span>


                        <strong>

                            $${product.price}

                        </strong>


                        <span
                            class="q17-price-currency">

                            ${product.currency}

                        </span>

                    </div>



                    <!-- BUY BUTTON -->

                    <a
                        href="${product.stripe}"
                        class="q17-buy-button">

                        <span>
                            BUY ${product.name.toUpperCase()}
                        </span>

                    </a>



                    <!-- TRUST -->

                    <div
                        class="q17-trust-glass">

                        <span>
                            ✓ SECURE CHECKOUT
                        </span>

                        <span>
                            ✓ QUALITY SELECTED
                        </span>

                    </div>

                </div>

            </div>

        </section>



        <!-- =================================================
             FEATURES
             ================================================= -->

        <section
            class="q17-tech-section">


            <div
                class="q17-tech-header">


                <div
                    class="q17-tech-label">

                    <span></span>

                    ENGINEERED FOR EVERYDAY

                </div>


                <h2>

                    Built for

                    <span>
                        ${product.category.toLowerCase()}.
                    </span>

                </h2>

            </div>



            <div
                class="q17-tech-grid">


                ${features.map(feature => `

                    <div
                        class="q17-tech-card">


                        <div
                            class="q17-tech-number">

                            ${feature[0]}

                        </div>


                        <div
                            class="q17-tech-content">


                            <strong>
                                ${feature[1]}
                            </strong>


                            <p>
                                ${feature[2]}
                            </p>


                        </div>

                    </div>

                `).join("")}


            </div>



            <div
                class="q17-tech-footer">

                <span
                    class="q17-tech-footer-line">
                </span>


                <span>
                    TECHNICAL DATA
                </span>


                <span
                    class="q17-tech-footer-line">
                </span>

            </div>

        </section>



        <!-- =================================================
             SPECIFICATIONS
             ================================================= -->

        <section
            class="q17-specs-section">


            <div
                class="q17-specs-header">


                <div
                    class="q17-specs-label">

                    <span></span>

                    TECHNICAL DATA

                </div>


                <h2>

                    ${product.name}

                    <span>
                        Specifications.
                    </span>

                </h2>

            </div>



            <div
                class="q17-specs-panel">


                <div
                    class="q17-specs-topline">

                    <span>
                        ${product.name}
                        / TECHNICAL PROFILE
                    </span>

                    <span>
                        VOLTICA
                    </span>

                </div>



                ${specifications.map(
                    (spec, index) => `

                    <div
                        class="q17-spec-row">


                        <span
                            class="q17-spec-number">

                            ${String(index + 1)
                                .padStart(2, "0")}

                        </span>


                        <span
                            class="q17-spec-name">

                            ${spec[0]}

                        </span>


                        <strong>

                            ${spec[1]}

                        </strong>


                    </div>

                `).join("")}



                <div
                    class="q17-spec-bottom">

                    <span>
                        ${product.name}
                    </span>

                    <span>
                        ENGINEERED FOR EVERYDAY
                    </span>

                </div>

            </div>

        </section>



        <!-- =================================================
             FINAL CTA
             ================================================= -->

        <section
            class="dynamic-final">


            <div
                class="final-glass-panel">


                <div
                    class="final-label">

                    ${product.name}

                </div>


                <div
                    class="final-line">
                </div>


                <h2>

                    Ready to

                    <span>
                        move?
                    </span>

                </h2>


                <p>

                    ${product.description}

                </p>


                <a
                    href="${product.stripe}"
                    class="final-buy-button">

                    GET
                    ${product.name.toUpperCase()}

                </a>


                <div
                    class="final-meta">


                    <span>
                        SECURE CHECKOUT
                    </span>


                    <span>
                        QUALITY SELECTED
                    </span>


                    <span>
                        VOLTICA
                    </span>


                </div>

            </div>

        </section>



        <!-- =================================================
             NAVIGATION
             ================================================= -->

        <section
            class="voltica-bottom-nav">


            <div
                class="voltica-nav-line">
            </div>


            <div
                class="voltica-nav-buttons">


                <a
                    href="index.html"
                    class="voltica-nav-button home-button">


                    <span
                        class="nav-icon">

                        ⌂

                    </span>


                    <span
                        class="nav-button-text">

                        <small>
                            RETURN
                        </small>

                        <strong>
                            HOME
                        </strong>

                    </span>

                </a>



                <a
                    href="store.html"
                    class="voltica-nav-button store-button">


                    <span
                        class="nav-icon">

                        V

                    </span>


                    <span
                        class="nav-button-text">

                        <small>
                            EXPLORE
                        </small>

                        <strong>
                            STORE
                        </strong>

                    </span>

                </a>


            </div>


            <div
                class="voltica-nav-brand">

                VOLTICA

            </div>

        </section>

    `;

});



/* =========================================================
   GALLERY
   ========================================================= */

function changeProductImage(button, image) {


    const mainImage =
        document.getElementById(
            "mainProductImage"
        );


    if (!mainImage) {
        return;
    }


    mainImage.style.opacity = "0";


    setTimeout(function () {

        mainImage.src = image;

        mainImage.style.opacity = "1";

    }, 150);



    document
        .querySelectorAll(
            ".voltica-thumb"
        )
        .forEach(function (item) {

            item.classList.remove(
                "active"
            );

        });


    button.classList.add(
        "active"
    );

}

<script src="products.js"></script>

<script>
document.addEventListener("DOMContentLoaded", function () {

    const params = new URLSearchParams(window.location.search);
    const productId = params.get("id");

    console.log("Product ID:", productId);
    console.log("Products:", volticaProducts);

});
</script>

    const params = new URLSearchParams(window.location.search);

    const product = volticaProducts.find(
        item => item.id === productId
    );

    if (!product) {
        document.body.innerHTML = `
            <div style="
                color:white;
                background:#050505;
                min-height:100vh;
                display:flex;
                align-items:center;
                justify-content:center;
                font-family:Arial;
            ">

            </div>
        `;
        return;
    }

    console.log("VOLTICA PRODUCT:", product.name);

</script>
</body>

</html>
