<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Voltica Store — The future of everyday."
    >

    <meta
        name="theme-color"
        content="#030303"
    >

    <title>Voltica — The Future of Everyday</title>

    <link
        rel="stylesheet"
        href="store.css"
    >

</head>


<body>


<!-- =====================================================
     PULSAR FIELD
     ===================================================== -->

<div
    class="pulsar-field"
    aria-hidden="true"
>

    <span class="pulsar p1"></span>
    <span class="pulsar p2"></span>
    <span class="pulsar p3"></span>
    <span class="pulsar p4"></span>
    <span class="pulsar p5"></span>
    <span class="pulsar p6"></span>

</div>


<!-- =====================================================
     BACKGROUND GRID
     ===================================================== -->

<div
    class="tech-grid"
    aria-hidden="true"
></div>


<!-- =====================================================
     HEADER
     ===================================================== -->

<header class="store-header">


    <!-- LOGO -->

    <a
        href="index.html"
        class="logo-acrylic"
        aria-label="Voltica"
    >

        <span class="logo-v">
            V
        </span>

        <span class="logo-text">
            VOLTICA
        </span>

    </a>


    <!-- NAVIGATION -->

    <nav class="store-nav">

        <a href="index.html">
            HOME
        </a>

        <a
            href="store.html"
            class="nav-active"
        >
            STORE
        </a>

        <a href="#contact">
            CONTACT
        </a>

    </nav>


    <!-- CART BUTTON -->

    <button
        type="button"
        class="cart-acrylic"
        id="cartButton"
        aria-label="Open shopping cart"
    >

        <span class="cart-icon">

            <svg
                viewBox="0 0 24 24"
                aria-hidden="true"
            >

                <path
                    d="M3 4h2l2.1 10.1a2 2 0 0 0 2 1.6h7.8a2 2 0 0 0 2-1.5L21 7H6"
                />

                <circle
                    cx="10"
                    cy="20"
                    r="1"
                />

                <circle
                    cx="18"
                    cy="20"
                    r="1"
                />

            </svg>

        </span>


        <span
            class="cart-count"
            id="cartCount"
        >
            0
        </span>

    </button>


</header>


<!-- =====================================================
     MAIN CONTENT
     ===================================================== -->

<main>


    <!-- =================================================
         HERO
         ================================================= -->

    <section class="store-hero">


        <div class="hero-pulsar">

            <span></span>

        </div>


        <!-- MAIN TITLE -->

        <h1 class="future-title">

            <span>
                THE FUTURE
            </span>

            <span class="future-second">
                OF EVERYDAY
            </span>

        </h1>


        <!-- COLLECTION OPENING -->

        <div class="opening-acrylic">

            <span class="opening-pulse"></span>

            <span>
                COLLECTION OPEN
            </span>

            <strong>
                SEPT 1
            </strong>

        </div>


    </section>


    <!-- =================================================
         PRODUCTS
         ================================================= -->

    <section
        class="products-section"
        aria-label="Voltica products"
    >


        <div
            id="productGrid"
            class="product-grid"
        >

            <div class="store-loading">

                <span class="loading-pulsar"></span>

            </div>

        </div>


    </section>


    <!-- =================================================
         CONTACT
         ================================================= -->

    <section
        id="contact"
        class="contact-section"
    >


        <div class="contact-acrylic">


            <div class="contact-pulsar"></div>


            <div class="contact-content">

                <span class="contact-label">
                    VOLTICA SUPPORT
                </span>


                <h2>
                    CONTACT US
                </h2>


                <p>
                    Need help with your order?
                </p>


                <a
                    href="mailto:support@volticastore.com"
                    class="contact-button"
                >

                    <span>
                        CONTACT US
                    </span>

                    <strong>
                        →
                    </strong>

                </a>

            </div>


        </div>


    </section>


</main>
