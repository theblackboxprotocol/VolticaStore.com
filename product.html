<html lang="en">

  <title>Voltica Store — Product</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(circle at 20% 10%, rgba(255,255,255,0.08), transparent 35%),
        radial-gradient(circle at 80% 90%, rgba(120,120,120,0.08), transparent 35%),
        #050505;
      color: #ffffff;
      font-family: Arial, Helvetica, sans-serif;
      overflow-x: hidden;
    }

    .product-page {
      width: 100%;
      min-height: 100vh;
      padding: 40px 20px;
    }

    .product-container {
      width: 100%;
      max-width: 1200px;
      margin: auto;

      background: rgba(255, 255, 255, 0.055);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 28px;

      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);

      box-shadow:
        0 30px 80px rgba(0, 0, 0, 0.65),
        inset 0 1px 0 rgba(255, 255, 255, 0.08);

      padding: 30px;
    }
  </style>
</head>
