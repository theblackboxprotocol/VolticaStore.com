<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Eurêka — Aide académique complémentaire</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(135deg, #f7f9fc 0%, #eef2f7 50%, #f0f4fa 100%);
      color: #1a1a1a;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      line-height: 1.5;
    }

    header {
      background: rgba(10, 47, 92, 0.95);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      color: white;
      padding: 16px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 4px 20px rgba(10, 47, 92, 0.15);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .logo-container {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .logo {
      font-size: 2.4rem;
      font-weight: 700;
      letter-spacing: -0.6px;
      text-shadow: 0 2px 4px rgba(0,0,0,0.2);
    }

    .badge {
      background: linear-gradient(135deg, #4da6ff, #66b3ff);
      color: #0a2f5c;
      font-size: 0.85rem;
      font-weight: 700;
      padding: 6px 14px;
      border-radius: 24px;
      box-shadow: 0 2px 8px rgba(77, 166, 255, 0.3);
    }

    .menu-btn {
      background: linear-gradient(135deg, #1e4d8c, #2a5aa0);
      color: white;
      border: none;
      font-size: 1.15rem;
      font-weight: 600;
      padding: 14px 28px;
      border-radius: 14px;
      cursor: pointer;
      min-height: 48px;
      min-width: 110px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      box-shadow: 0 4px 12px rgba(30, 77, 140, 0.3);
      transition: all 0.2s ease;
    }

    .menu-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 16px rgba(30, 77, 140, 0.4);
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px 60px;
      text-align: center;
    }

    .avatar-zone {
      width: 100%;
      max-width: 700px;
      height: 420px;
      background: rgba(232, 238, 245, 0.7);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.6);
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 36px;
      box-shadow: 0 8px 32px rgba(10, 47, 92, 0.08), inset 0 1px 0 rgba(255,255,255,0.5);
      position: relative;
      overflow: hidden;
    }

    .avatar-zone anam-agent {
      width: 100% !important;
      height: 100% !important;
      display: block;
    }

    .buttons {
      display: flex;
      flex-direction: column;
      gap: 18px;
      width: 100%;
      max-width: 480px;
    }

    .big-btn {
      background: linear-gradient(135deg, #0a2f5c, #153a6e);
      color: white;
      border: none;
      font-size: 1.4rem;
      font-weight: 600;
      padding: 22px 32px;
      border-radius: 16px;
      cursor: pointer;
      min-height: 72px;
      width: 100%;
      box-shadow: 0 6px 20px rgba(10, 47, 92, 0.2);
      transition: all 0.25s ease;
      position: relative;
      overflow: hidden;
    }

    .big-btn::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.15), transparent);
      transition: left 0.5s;
    }

    .big-btn:hover::before {
      left: 100%;
    }

    .big-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 28px rgba(10, 47, 92, 0.3);
    }

    .big-btn:active {
      transform: translateY(0);
    }

    footer {
      background: rgba(232, 238, 245, 0.85);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      color: #2c3e50;
      text-align: center;
      padding: 20px 16px;
      font-size: 0.95rem;
      border-top: 1px solid rgba(10, 47, 92, 0.1);
      margin-top: auto;
    }

    /* Menu latéral avec glassmorphism */
    .overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(10, 47, 92, 0.4);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      z-index: 200;
      display: none;
      transition: opacity 0.3s;
    }

    .overlay.active {
      display: block;
    }

    .side-menu {
      position: fixed;
      top: 0;
      right: -100%;
      width: 340px;
      max-width: 88vw;
      height: 100%;
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      z-index: 300;
      box-shadow: -8px 0 32px rgba(10, 47, 92, 0.15);
      border-left: 1px solid rgba(255, 255, 255, 0.5);
      transition: right 0.35s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex;
      flex-direction: column;
      padding: 24px 0;
    }

    .side-menu.active {
      right: 0;
    }

    .menu-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 28px 24px;
      border-bottom: 1px solid rgba(10, 47, 92, 0.1);
    }

    .menu-header h2 {
      font-size: 1.6rem;
      color: #0a2f5c;
      font-weight: 700;
    }

    .close-btn {
      background: rgba(10, 47, 92, 0.08);
      border: none;
      font-size: 1.8rem;
      cursor: pointer;
      color: #0a2f5c;
      width: 48px;
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 12px;
      transition: background 0.2s;
    }

    .close-btn:hover {
      background: rgba(10, 47, 92, 0.15);
    }

    .menu-options {
      flex: 1;
      overflow-y: auto;
      padding: 12px 0;
    }

    .menu-item {
      padding: 20px 32px;
      font-size: 1.2rem;
      font-weight: 500;
      color: #1a1a1a;
      cursor: pointer;
      border-bottom: 1px solid rgba(10, 47, 92, 0.06);
      transition: all 0.2s ease;
    }

    .menu-item:hover {
      background: rgba(10, 47, 92, 0.06);
      padding-left: 36px;
    }

    .menu-item:active {
      background: rgba(10, 47, 92, 0.1);
    }

    @media (max-width: 600px) {
      .logo {
        font-size: 1.9rem;
      }
      .avatar-zone {
        height: 340px;
        border-radius: 16px;
      }
      .big-btn {
        font-size: 1.2rem;
        padding: 18px 24px;
        min-height: 64px;
      }
      .menu-btn {
        padding: 12px 20px;
        font-size: 1.05rem;
      }
    }
  </style>
</head>
<body>

  <header>
    <div class="logo-container">
      <div class="logo">Eurêka</div>
      <div class="badge">Bêta v1.0</div>
    </div>
    <button class="menu-btn" id="menuBtn" aria-label="Ouvrir le menu">
      Menu
    </button>
  </header>

  <main>
    <div class="avatar-zone" id="avatarZone">
      <anam-agent agent-id="b4cb0d3e-ad02-5c1d-a956-a992762edfc1" api-base-url="https://lab.anam.ai" layout="inline" agent-name="Eurêka" call-to-action="Parler à Eurêka"></anam-agent>
    </div>

    <div class="buttons">
      <button class="big-btn" id="btnParler">Parler à Eurêka</button>
      <button class="big-btn" id="btnTexte">Poser une question en texte</button>
    </div>
  </main>

  <footer>
    Eurêka — aide académique complémentaire — Bêta v1.0 — Page test non liée à la boutique
  </footer>

  <!-- Overlay et menu -->
  <div class="overlay" id="overlay"></div>
  <div class="side-menu" id="sideMenu">
    <div class="menu-header">
      <h2>Menu</h2>
      <button class="close-btn" id="closeBtn" aria-label="Fermer le menu">×</button>
    </div>
    <div class="menu-options">
      <div class="menu-item" data-action="new">Nouvelle conversation</div>
      <div class="menu-item" data-action="doc">Partager un document</div>
      <div class="menu-item" data-action="history">Historique des conversations</div>
      <div class="menu-item" data-action="books">Mes livres PDF</div>
      <div class="menu-item" data-action="quiz">Mes quiz et erreurs à revoir</div>
      <div class="menu-item" data-action="avatar">Avatar : activé / Texte seul</div>
      <div class="menu-item" data-action="help">Aide : comment utiliser Eurêka ?</div>
    </div>
  </div>

  <script src="https://unpkg.com/@anam-ai/agent-widget" async></script>
  <script>
    const menuBtn = document.getElementById('menuBtn');
    const closeBtn = document.getElementById('closeBtn');
    const overlay = document.getElementById('overlay');
    const sideMenu = document.getElementById('sideMenu');
    const menuItems = document.querySelectorAll('.menu-item');
    const avatarZone = document.getElementById('avatarZone');

    function openMenu() {
      sideMenu.classList.add('active');
      overlay.classList.add('active');
    }

    function closeMenu() {
      sideMenu.classList.remove('active');
      overlay.classList.remove('active');
    }

    menuBtn.addEventListener('click', openMenu);
    closeBtn.addEventListener('click', closeMenu);
    overlay.addEventListener('click', closeMenu);

    menuItems.forEach(item => {
      item.addEventListener('click', () => {
        alert('Bientôt disponible');
        closeMenu();
      });
    });

    // Scroll fluide vers la zone avatar
    function scrollToAvatar() {
      avatarZone.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }

    document.getElementById('btnParler').addEventListener('click', scrollToAvatar);
    document.getElementById('btnTexte').addEventListener('click', scrollToAvatar);
  </script>

</body>
</html>
