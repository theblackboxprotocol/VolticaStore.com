<style>
    /* =====================================================
       PAGE-SPECIFIC ADJUSTMENTS

       ===================================================== */

    /* Remonter le slogan "THE FUTURE OF EVERYDAY" */
    .store-hero {

        padding-bottom: 40px !important;

    }

    /* Rapprocher les produits vers le haut */

        padding-top: 20px !important;
    }

    /* Bouton panier dans le menu mobile */
    .nav-cart-button {
        width: 100%;
        display: flex !important;
        align-items: center !important;
        gap: 14px !important;
        padding: 0 !important;
        margin-top: 8px !important;
        border: 0 !important;
        background: transparent !important;
        color: rgba(255, 255, 255, 0.75) !important;
        font-family: "Manrope", sans-serif !important;
        font-size: 13px !important;
        font-weight: 600 !important;
        letter-spacing: 0.2em !important;
        cursor: pointer !important;
        transition: all 0.3s ease !important;
    }

    .nav-cart-button:hover {
        color: #fff !important;
        transform: translateX(4px) !important;
    }

    /* Cart Close Button (X) */
    .cart-close-x {
        display: flex !important;
        align-items: center !important;
        justify-content: center !important;
        width: 40px !important;
        height: 40px !important;
        background: rgba(255, 255, 255, 0.05) !important;
        border: 1px solid rgba(255, 255, 255, 0.1) !important;
        border-radius: 10px !important;
        cursor: pointer !important;
        transition: all 0.3s ease !important;
    }

    .cart-close-x:hover {
        background: rgba(255, 255, 255, 0.1) !important;
        transform: rotate(90deg) !important;
    }

    .cart-close-x svg {
        width: 16px !important;
        height: 16px !important;
        stroke: #fff !important;
        stroke-width: 2 !important;
    }

    /* =====================================================
       RESPONSIVE ADJUSTMENTS
       ===================================================== */

<!-- =====================================================
     SCRIPTS
     ===================================================== -->

<script>
    document.addEventListener('DOMContentLoaded', function() {
        // Mobile Menu Logic
        const menuToggle = document.getElementById('mobileMenuToggle');
        const mobileMenu = document.getElementById('mobileMenu');
        
        if (menuToggle && mobileMenu) {
            menuToggle.addEventListener('click', function() {
                const isExpanded = menuToggle.getAttribute('aria-expanded') === 'true';
                menuToggle.setAttribute('aria-expanded', !isExpanded);
                mobileMenu.classList.toggle('mobile-open');
            });
            
            const navLinks = mobileMenu.querySelectorAll('a');
            navLinks.forEach(link => {
                link.addEventListener('click', () => {
                    mobileMenu.classList.remove('mobile-open');
                    menuToggle.setAttribute('aria-expanded', 'false');
                });
            });
        }

        // Cart Button Logic — ouvre le cart et ferme le menu mobile
        const cartOpenButtons = document.querySelectorAll('[data-cart-open]');
        const cartDrawer = document.getElementById('cartDrawer');
        const cartOverlay = document.getElementById('cartOverlay');
        
        cartOpenButtons.forEach(button => {
            button.addEventListener('click', function() {
                // Ouvre le cart
                if (cartDrawer) {
                    cartDrawer.classList.add('open');
                }
                
                if (cartOverlay) {
                    cartOverlay.hidden = false;
                }
                
                document.body.classList.add('cart-is-open');
                
                // Ferme le menu mobile
                if (mobileMenu) {
                    mobileMenu.classList.remove('mobile-open');
                }
                
                if (menuToggle) {
                    menuToggle.setAttribute('aria-expanded', 'false');
                }
            });
        });
    });
</script>
