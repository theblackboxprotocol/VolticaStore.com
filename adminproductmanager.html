<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Administration - Voltica Store</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Gestionnaire de Produits</h1>
        
        <form id="productForm" class="admin-form">
            <input type="hidden" id="prodId">
            <div class="form-group">
                <label>Nom du Produit</label>
                <input type="text" id="prodName" required>
            </div>
            <div class="form-group">
                <label>Prix ($)</label>
                <input type="number" step="0.01" id="prodPrice" required>
            </div>
            <div class="form-group">
                <label>Lien Stripe Checkout (URL)</label>
                <input type="url" id="prodStripeUrl" placeholder="https://buy.stripe.com/..." required>
            </div>
            <div class="form-group">
                <label>URL de l'image</label>
                <input type="url" id="prodImage" required>
            </div>
            <div class="form-group">
                <label>Description</label>
                <textarea id="prodDesc" rows="3"></textarea>
            </div>
            <button type="submit" class="btn">Enregistrer le produit</button>
        </form>

        <h2>Produits en ligne</h2>
        <div id="adminProductList" class="product-grid"></div>
    </div>

    <script src="products.js"></script>
    <script>
        const form = document.getElementById('productForm');
        
        form.addEventListener('submit', (e) => {
            e.preventDefault();
            const product = {
                id: document.getElementById('prodId').value || null,
                name: document.getElementById('prodName').value,
                price: parseFloat(document.getElementById('prodPrice').value).toFixed(2),
                stripeUrl: document.getElementById('prodStripeUrl').value,
                imageUrl: document.getElementById('prodImage').value,
                description: document.getElementById('prodDesc').value
            };
            saveSingleProduct(product);
            form.reset();
            document.getElementById('prodId').value = '';
            loadAdminList();
        });

        function loadAdminList() {
            const list = document.getElementById('adminProductList');
            const products = getProducts();
            list.innerHTML = products.map(p => `
                <div class="product-card">
                    <img src="${p.imageUrl}" class="product-image">
                    <div class="product-info">
                        <div class="product-title">${p.name}</div>
                        <div class="product-price">${p.price} $</div>
                        <button onclick="deleteProduct('${p.id}'); loadAdminList();" class="btn btn-danger">Supprimer</button>
                    </div>
                </div>
            `).join('');
        }

        loadAdminList();
    </script>
</body>
</html>
