<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Voltica Store — Product</title>

    <link
        rel="stylesheet"
        href="style.css">

</head>

<body>

<main id="productView">

    <div class="product-loading">
        LOADING PRODUCT...
    </div>

</main>


<script src="products.js"></script>

<script>

document.addEventListener("DOMContentLoaded", function () {

    const params = new URLSearchParams(
        window.location.search
    );

    const productId = params.get("id");

    const product =
        volticaProducts.find(
            item => item.id === productId
        );

    const container =
        document.getElementById("productView");


    if (!product) {

        container.innerHTML = `
            <section class="product-not-found">

                <span>404</span>

                <h1>
                    Product not found.
                </h1>

                <a href="store.html">
                    RETURN TO STORE →
                </a>

            </section>
        `;

        return;
    }


    document.title =
        `${product.name} — Voltica Store`;


    const images =
        product.images || [product.image];


    container.innerHTML = `

        <!-- HERO -->

        <section class="dynamic-product-hero">


            <!-- GALLERY -->

            <div class="dynamic-gallery">

                <div class="dynamic-main-image">

                    <span class="dynamic-badge">
                        ${product.badge}
                    </span>

                    <img
                        id="dynamicMainImage"
                        src="${images[0]}"
                        alt="${product.name}">

                    <div class="dynamic-scan"></div>

                </div>


                <div class="dynamic-thumbnails">

                    ${images.map((image, index) => `

                        <button
                            class="dynamic-thumb ${
                                index === 0 ? "active" : ""
                            }"
                            data-image="${image}">

                            <img
                                src="${image}"
                                alt="${product.name} ${index + 1}">

                            <span>
                                ${String(index + 1).padStart(2, "0")}
                            </span>

                        </button>

                    `).join("")}

                </div>

            </div>


            <!-- PRODUCT INFO -->

            <div class="dynamic-product-info">

                <span class="dynamic-category">
                    VOLTICA / ${product.category}
                </span>

                <h1>
                    ${product.name}
                </h1>

                <h2>
                    Wireless freedom.
                    <span>Built to move.</span>
                </h2>

                <p>
                    ${product.description}
                </p>


                <div class="dynamic-price">

                    <strong>
                        $${product.price}
                    </strong>

                    <span>
                        ${product.currency}
                    </span>

                </div>


                <a
                    href="${product.stripe}"
                    class="dynamic-buy-button">

                    <span>
                        BUY ${product.name.toUpperCase()}
                    </span>

                    <strong>
                        →
                    </strong>

                </a>


                <div class="dynamic-trust">

                    <span>✓ SECURE CHECKOUT</span>
                    <span>✓ QUALITY SELECTED</span>

                </div>

            </div>

        </section>


        <!-- FEATURES -->

        <section class="dynamic-features">

            <div class="dynamic-section-heading">

                <span>
                    ENGINEERED FOR EVERYDAY
                </span>

                <h2>
                    Built for
                    <span>movement.</span>
                </h2>

            </div>


            <div class="dynamic-feature-grid">

                ${product.features.map(feature => `

                    <div class="dynamic-feature-card">

                        <span>
                            ${feature[0]}
                        </span>

                        <strong>
                            ${feature[1]}
                        </strong>

                        <p>
                            ${feature[2]}
                        </p>

                    </div>

                `).join("")}

            </div>

        </section>


        <!-- SPECIFICATIONS -->

        <section class="dynamic-specifications">

            <div class="dynamic-section-heading">

                <span>
                    TECHNICAL DATA
                </span>

                <h2>
                    ${product.name}
                    <span>Specifications.</span>
                </h2>

            </div>


            <div class="dynamic-spec-table">

                ${product.specifications.map(spec => `

                    <div class="dynamic-spec-row">

                        <span>
                            ${spec[0]}
                        </span>

                        <strong>
                            ${spec[1]}
                        </strong>

                    </div>

                `).join("")}

            </div>

        </section>


        <!-- FINAL CTA -->

        <section class="dynamic-final">

            <span>
                ${product.name}
            </span>

            <h2>
                Ready to
                <span>move?</span>
            </h2>

            <a href="${product.stripe}">
                GET ${product.name.toUpperCase()}
                <strong>→</strong>
            </a>

        </section>

    `;


    /* GALLERY */

    const mainImage =
        document.getElementById(
            "dynamicMainImage"
        );

    const thumbnails =
        document.querySelectorAll(
            ".dynamic-thumb"
        );


    thumbnails.forEach(function (thumb) {

        thumb.addEventListener(
            "click",
            function () {

                const newImage =
                    thumb.dataset.image;

                mainImage.style.opacity = "0";

                setTimeout(function () {

                    mainImage.src =
                        newImage;

                    mainImage.style.opacity =
                        "1";

                }, 150);


                thumbnails.forEach(
                    item =>
                        item.classList.remove(
                            "active"
                        )
                );

                thumb.classList.add("active");

            }
        );

    });

});

</script>

</body>
</html>
