<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<!-- =====================================================
     SEO — CORE
     ===================================================== -->

<meta
    name="description"
    content="Shop premium technology at Voltica Store. Discover precision audio, headphones, earbuds, gaming gear, creator gear, smart home products and lifestyle tech."
>

<meta
    name="robots"
    content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1"
>

<meta
    name="theme-color"
    content="#030303"
>

<meta
    name="author"
    content="Voltica Store"
>

<meta
    name="application-name"
    content="Voltica Store"
>


<!-- =====================================================
     CANONICAL
     ===================================================== -->

<link
    rel="canonical"
    href="https://volticastore.com/store.html"
>


<!-- =====================================================
     OPEN GRAPH
     ===================================================== -->

<meta
    property="og:type"
    content="website"
>

<meta
    property="og:title"
    content="Shop Premium Technology | Voltica Store"
>

<meta
    property="og:description"
    content="Explore premium audio, gaming gear, creator gear, smart home products and lifestyle technology at Voltica Store."
>

<meta
    property="og:url"
    content="https://volticastore.com/store.html"
>

<meta
    property="og:site_name"
    content="Voltica Store"
>

<meta
    property="og:locale"
    content="en_US"
>


<!-- =====================================================
     TWITTER / X
     ===================================================== -->

<meta
    name="twitter:card"
    content="summary_large_image"
>

<meta
    name="twitter:title"
    content="Shop Premium Technology | Voltica Store"
>

<meta
    name="twitter:description"
    content="Explore premium audio, gaming gear, creator gear, smart home products and lifestyle technology at Voltica Store."
>


<!-- =====================================================
     TITLE
     ===================================================== -->

<title>
    Shop Premium Technology | Voltica Store
</title>


<!-- =====================================================
     GOOGLE ANALYTICS 4
     ===================================================== -->

<script
    async
    src="https://www.googletagmanager.com/gtag/js?id=G-LCJ9SC3NZP"
></script>

<script>

    window.dataLayer =
        window.dataLayer || [];


    function gtag() {

        dataLayer.push(arguments);

    }


    gtag(
        "js",
        new Date()
    );


    gtag(
        "config",
        "G-LCJ9SC3NZP"
    );

</script>


<!-- =====================================================
     STORE STYLES
     ===================================================== -->

<link
    rel="stylesheet"
    href="store.css"
>


<!-- =====================================================
     STRUCTURED DATA — WEBSITE
     ===================================================== -->

<script type="application/ld+json">
{
    "@context": "https://schema.org",
    "@type": "WebSite",
    "name": "Voltica Store",
    "url": "https://volticastore.com/",
    "description": "Premium technology, precision audio, gaming gear, creator gear, smart home products and lifestyle tech."
}
</script>


<!-- =====================================================
     STRUCTURED DATA — STORE PAGE
     ===================================================== -->

<script type="application/ld+json">
{
    "@context": "https://schema.org",
    "@type": "CollectionPage",
    "name": "Voltica Store",
    "url": "https://volticastore.com/store.html",
    "description": "Shop premium technology, audio, gaming gear, creator gear, smart home products and lifestyle technology at Voltica Store."
}
</script>

</head>


<body>


<!-- =====================================================
     PULSAR FIELD
     ===================================================== -->

<div
    class="pulsar-field"
    aria-hidden="true"
>

    <span class="pulsar p1"></span>
    <span class="pulsar p2"></span>
    <span class="pulsar p3"></span>
    <span class="pulsar p4"></span>
    <span class="pulsar p5"></span>
    <span class="pulsar p6"></span>

</div>


<!-- =====================================================
     BACKGROUND GRID
     ===================================================== -->

<div
    class="tech-grid"
    aria-hidden="true"
></div>


<!-- =====================================================
     HEADER
     ===================================================== -->

<header class="store-header">


    <!-- LOGO -->

    <a
        href="index.html"
        class="logo-acrylic"
        aria-label="Voltica Store Home"
    >

        <span class="logo-v">
            V
        </span>

        <span class="logo-text">
            VOLTICA
        </span>

    </a>


    <!-- NAVIGATION -->

    <nav
        class="store-nav"
        aria-label="Main navigation"
    >

        <a href="index.html">
            HOME
        </a>

        <a
            href="store.html"
            class="nav-active"
        >
            STORE
        </a>

        <a href="#contact">
            CONTACT
        </a>

    </nav>


    <!-- SHOPPING CART -->

    <button
        type="button"
        class="cart-acrylic"
        id="cartButton"
        aria-label="Open shopping cart"
        title="Shopping Cart"
    >

        <svg
            class="cart-icon"
            viewBox="0 0 24 24"
            aria-hidden="true"
            focusable="false"
        >

            <path
                d="M3 4H5L7.2 15.2C7.4 16.2 8.3 17 9.3 17H18.2C19.2 17 20.1 16.3 20.4 15.3L22 9H6"
            />

            <circle
                cx="9"
                cy="20"
                r="1.4"
            />

            <circle
                cx="18"
                cy="20"
                r="1.4"
            />

        </svg>


        <span
            class="cart-count"
            id="cartCount"
        >
            0
        </span>

    </button>

</header>


<!-- =====================================================
     MAIN CONTENT
     ===================================================== -->

<main>


    <!-- =================================================
         HERO
         ================================================= -->

    <section
        class="store-hero"
        aria-labelledby="store-title"
    >


        <div
            class="hero-pulsar"
            aria-hidden="true"
        >

            <span></span>

        </div>


        <h1
            class="future-title"
            id="store-title"
        >

            <span>
                THE FUTURE
            </span>

            <span class="future-second">
                OF EVERYDAY
            </span>

        </h1>


        <div
            class="opening-acrylic"
            aria-label="Voltica collection opening September 1"
        >

            <span
                class="opening-pulse"
                aria-hidden="true"
            ></span>

            <span>
                COLLECTION OPEN
            </span>

            <strong>
                SEPT 1
            </strong>

        </div>


    </section>


    <!-- =================================================
         PRODUCTS
         ================================================= -->

    <section
        class="products-section"
        aria-labelledby="products-title"
    >

        <h2
            id="products-title"
            style="position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;"
        >
            Voltica Store Products
        </h2>


        <div
            id="productGrid"
            class="product-grid"
        ></div>

    </section>


    <!-- =================================================
         CONTACT
         ================================================= -->

    <section
        id="contact"
        class="contact-section"
        aria-labelledby="contact-title"
    >

        <div class="contact-acrylic">


            <div
                class="contact-pulsar"
                aria-hidden="true"
            ></div>


            <div class="contact-content">

                <span class="contact-label">
                    VOLTICA SUPPORT
                </span>


                <h2 id="contact-title">
                    CONTACT US
                </h2>


                <p>
                    Need help with your order?
                </p>


                <a
                    href="mailto:contact@volticastore.com"
                    class="contact-button"
                    aria-label="Contact Voltica Store by email"
                >

                    <span>
                        CONTACT US
                    </span>

                    <strong aria-hidden="true">
                        →
                    </strong>

                </a>

            </div>


        </div>

    </section>

</main>


<!-- =====================================================
     CART OVERLAY
     ===================================================== -->

<div
    class="cart-overlay"
    id="cartOverlay"
    aria-hidden="true"
    hidden
></div>


<!-- =====================================================
     CART DRAWER
     ===================================================== -->

<aside
    class="cart-drawer"
    id="cartDrawer"
    aria-label="Shopping cart"
>

    <div class="cart-header">

        <div>

            <span class="cart-small-title">
                VOLTICA
            </span>

            <h2>
                CART
            </h2>

        </div>


        <button
            type="button"
            class="cart-close"
            id="cartClose"
            aria-label="Close shopping cart"
        >
            CLOSE
        </button>

    </div>


    <div
        class="cart-items"
        id="cartItems"
    ></div>


    <div class="cart-footer">

        <div class="cart-total-row">

            <span>
                TOTAL
            </span>

            <strong id="cartTotal">
                $0.00
            </strong>

        </div>


        <button
            type="button"
            class="checkout-button"
            id="checkoutButton"
        >

            CHECKOUT

            <span>
                →
            </span>

        </button>

    </div>

</aside>


<!-- =====================================================
     FOOTER
     ===================================================== -->

<footer class="store-footer">

    <div class="footer-acrylic">

        <span>
            VOLTICA
        </span>

        <span>
            THE FUTURE OF EVERYDAY
        </span>

        <span>
            © 2026
        </span>

    </div>

</footer>


<!-- =====================================================
     DATABASE
     ===================================================== -->

<script src="products.js?v=7"></script>
<script src="store.js?v=7"></script>


</body>
</html>
