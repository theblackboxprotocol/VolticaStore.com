<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Voltica Store — Product"
    >

    <meta
        name="theme-color"
        content="#050505"
    >

    <title>Voltica Store</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


<main
    id="productView"
    class="dynamic-product-page"
    aria-live="polite"
>

    <div class="product-loading">
        LOADING PRODUCT...
    </div>

</main>


<!-- =========================================================
     VOLTICA PRODUCT DATABASE
     IMPORTANT:
     products.js MUST be loaded before the product engine.
     ========================================================= -->

<script src="products.js"></script>


<!-- =========================================================
     VOLTICA PRODUCT ENGINE
     No API.
     No fetch().
     No external database.
     Stripe checkout uses the URL stored in products.js.
     ========================================================= -->

<script>

(() => {

    "use strict";


    /* =========================================================
       DOM READY
       ========================================================= */

    document.addEventListener("DOMContentLoaded", initProductPage);


    /* =========================================================
       MAIN ENGINE
       ========================================================= */

    function initProductPage() {

        const container =
            document.getElementById("productView");


        if (!container) {
            return;
        }


        /* -----------------------------------------------------
           DATABASE VALIDATION
           ----------------------------------------------------- */

        if (
            typeof volticaProducts === "undefined" ||
            !Array.isArray(volticaProducts)
        ) {

            renderError(
                container,
                "DATABASE ERROR",
                "Product database unavailable.",
                "The Voltica product database could not be loaded."
            );

            return;
        }


        if (volticaProducts.length === 0) {

            renderError(
                container,
                "DATABASE EMPTY",
                "No products available.",
                "The Voltica product database contains no products."
            );

            return;
        }


        /* -----------------------------------------------------
           READ PRODUCT ID
           ----------------------------------------------------- */

        const params =
            new URLSearchParams(
                window.location.search
            );


        const requestedId =
            normalize(
                params.get("id")
            );


        if (!requestedId) {

            renderError(
                container,
                "400",
                "Product ID missing.",
                "No product was specified."
            );

            return;
        }


        /* -----------------------------------------------------
           FIND PRODUCT
           ----------------------------------------------------- */

        const product =
            volticaProducts.find(
                item =>
                    item &&
                    normalize(item.id) === requestedId
            );


        if (!product) {

            renderError(
                container,
                "404",
                "Product not found.",
                `No Voltica product matches "${requestedId}".`
            );

            return;
        }


        /* -----------------------------------------------------
           NORMALIZE PRODUCT DATA
           ----------------------------------------------------- */

        const data =
            normalizeProduct(product);


        /* -----------------------------------------------------
           VALIDATION
           ----------------------------------------------------- */

        if (!data.images.length) {

            renderError(
                container,
                "IMAGE ERROR",
                "Product images unavailable.",
                data.name
            );

            return;
        }


        /* -----------------------------------------------------
           PAGE METADATA
           ----------------------------------------------------- */

        updatePageMetadata(data);


        /* -----------------------------------------------------
           RENDER
           ----------------------------------------------------- */

        container.innerHTML =
            buildProductPage(data);


        /* -----------------------------------------------------
           INTERACTIONS
           ----------------------------------------------------- */

        initGallery(container);

        initImageFallbacks(container);

        initExternalLinks(container);


        /* -----------------------------------------------------
           DEBUG
           ----------------------------------------------------- */

        if (window.location.hostname === "localhost") {

            console.log(
                "[VOLTICA]",
                "Product loaded:",
                data.name
            );

            console.log(
                "[VOLTICA]",
                "Product ID:",
                data.id
            );

            console.log(
                "[VOLTICA]",
                "Images:",
                data.images.length
            );

            console.log(
                "[VOLTICA]",
                "Features:",
                data.features.length
            );

            console.log(
                "[VOLTICA]",
                "Specifications:",
                data.specifications.length
            );

        }

    }


    /* =========================================================
       PRODUCT NORMALIZER
       ========================================================= */

    function normalizeProduct(product) {

        const name =
            clean(
                product.name,
                "Voltica Product"
            );


        const category =
            clean(
                product.category,
                "VOLTICA"
            );


        const badge =
            clean(
                product.badge,
                "NEW"
            );


        const currency =
            clean(
                product.currency,
                "USD"
            ).toUpperCase();


        const description =
            clean(
                product.description,
                "Product details not available."
            );


        const images =
            getImages(product);


        const features =
            normalizeFeatures(
                product.features
            );


        const specifications =
            normalizeSpecifications(
                product.specifications
            );


        const stripe =
            normalizeStripe(
                product.stripe
            );


        return {

            id:
                clean(product.id),

            sku:
                clean(product.sku),

            name,

            category,

            badge,

            currency,

            price:
                formatPrice(
                    product.price
                ),

            description,

            images,

            features,

            specifications,

            stripe,

            supplierLink:
                normalizeURL(
                    product.supplierLink
                ),

            cost:
                clean(product.cost)

        };

    }


    /* =========================================================
       IMAGE NORMALIZATION
       ========================================================= */

    function getImages(product) {

        let images = [];


        if (
            Array.isArray(product.images)
        ) {

            images =
                product.images;

        }
        else if (
            product.image
        ) {

            images =
                [product.image];

        }


        return images
            .filter(
                image =>
                    typeof image === "string" &&
                    image.trim() !== ""
            )
            .map(
                image =>
                    image.trim()
            );

    }


    /* =========================================================
       FEATURE NORMALIZATION
       ========================================================= */

    function normalizeFeatures(features) {

        if (
            !Array.isArray(features)
        ) {
            return [];
        }


        return features
            .filter(
                feature =>
                    Array.isArray(feature)
            )
            .map(
                feature => {

                    return {

                        number:
                            clean(
                                feature[0],
                                ""
                            ),

                        title:
                            clean(
                                feature[1],
                                ""
                            ),

                        text:
                            clean(
                                feature[2],
                                ""
                            )

                    };

                }
            )
            .filter(
                feature =>
                    feature.title ||
                    feature.text
            );

    }


    /* =========================================================
       SPECIFICATION NORMALIZATION
       ========================================================= */

    function normalizeSpecifications(specifications) {

        if (
            !Array.isArray(specifications)
        ) {
            return [];
        }


        return specifications
            .filter(
                specification =>
                    Array.isArray(specification)
            )
            .map(
                specification => {

                    return {

                        label:
                            clean(
                                specification[0],
                                ""
                            ),

                        value:
                            clean(
                                specification[1],
                                ""
                            )

                    };

                }
            )
            .filter(
                specification =>
                    specification.label ||
                    specification.value
            );

    }


    /* =========================================================
       STRING HELPERS
       ========================================================= */

    function clean(
        value,
        fallback = ""
    ) {

        if (
            value === undefined ||
            value === null
        ) {

            return fallback;

        }


        const result =
            String(value).trim();


        return result || fallback;

    }


    function normalize(value) {

        return clean(value)
            .toLowerCase();

    }


    /* =========================================================
       HTML ESCAPING
       ========================================================= */

    function escapeHTML(value) {

        return String(
            value ?? ""
        )
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );

    }


    /* =========================================================
       DESCRIPTION FORMAT
       ========================================================= */

    function formatDescription(value) {

        return escapeHTML(value)
            .replace(
                /\n{2,}/g,
                "</p><p>"
            )
            .replace(
                /\n/g,
                "<br>"
            );

    }


    /* =========================================================
       PRICE FORMAT
       ========================================================= */

    function formatPrice(value) {

        const numeric =
            Number(
                String(value)
                    .replace(
                        /[^0-9.-]/g,
                        ""
                    )
            );


        if (
            Number.isFinite(numeric)
        ) {

            return numeric.toFixed(2);

        }


        return clean(
            value,
            "—"
        );

    }


    /* =========================================================
       STRIPE URL VALIDATION
       ========================================================= */

    function normalizeStripe(value) {

        const url =
            normalizeURL(value);


        if (!url) {
            return "";
        }


        try {

            const parsed =
                new URL(url);


            if (
                parsed.protocol !== "https:"
            ) {

                return "";

            }


            if (
                parsed.hostname !== "buy.stripe.com"
            ) {

                return "";

            }


            return parsed.href;

        }
        catch {

            return "";

        }

    }


    /* =========================================================
       GENERAL URL VALIDATION
       ========================================================= */

    function normalizeURL(value) {

        const url =
            clean(value);


        if (!url) {
            return "";
        }


        try {

            const parsed =
                new URL(
                    url,
                    window.location.href
                );


            if (
                parsed.protocol !== "https:" &&
                parsed.protocol !== "http:"
            ) {

                return "";

            }


            return parsed.href;

        }
        catch {

            return "";

        }

    }


    /* =========================================================
       CATEGORY SUBTITLE
       ========================================================= */

    function createSubtitle(category) {

        const normalized =
            category.toUpperCase();


        if (
            normalized.includes("GAMING")
        ) {

            return `
                <h2>
                    Built to play.
                    <span>Designed to perform.</span>
                </h2>
            `;

        }


        if (
            normalized.includes("CREATOR")
        ) {

            return `
                <h2>
                    Create without limits.
                    <span>Built to move.</span>
                </h2>
            `;

        }


        if (
            normalized.includes("LIFESTYLE")
        ) {

            return `
                <h2>
                    Technology for life.
                    <span>Designed different.</span>
                </h2>
            `;

        }


        if (
            normalized.includes("TECH")
        ) {

            return `
                <h2>
                    Smarter everyday.
                    <span>Built to adapt.</span>
                </h2>
            `;

        }


        if (
            normalized.includes("HEADPHONE") ||
            normalized.includes("AUDIO")
        ) {

            return `
                <h2>
                    Sound without limits.
                    <span>Designed to immerse.</span>
                </h2>
            `;

        }


        return `
            <h2>
                Wireless freedom.
                <span>Built to move.</span>
            </h2>
        `;

    }


    /* =========================================================
       BUY BUTTON
       ========================================================= */

    function buildBuyButton(
        stripe,
        className
    ) {

        if (!stripe) {

            return `
                <div
                    class="${className}"
                    style="
                        opacity:.45;
                        pointer-events:none;
                        cursor:not-allowed;
                    "
                    aria-disabled="true"
                >
                    <span>
                        COMING SOON
                    </span>
                </div>
            `;

        }


        return `
            <a
                href="${escapeHTML(stripe)}"
                class="${className}"
                data-stripe-checkout="true"
                target="_blank"
                rel="noopener noreferrer"
                aria-label="Buy this product securely with Stripe"
            >
                <span>
                    BUY NOW
                </span>
            </a>
        `;

    }


    /* =========================================================
       FINAL BUY BUTTON
       ========================================================= */

    function buildFinalButton(stripe) {

        if (!stripe) {

            return `
                <div
                    class="final-buy-button"
                    style="
                        opacity:.45;
                        pointer-events:none;
                        cursor:not-allowed;
                    "
                    aria-disabled="true"
                >
                    COMING SOON
                </div>
            `;

        }


        return `
            <a
                href="${escapeHTML(stripe)}"
                class="final-buy-button"
                data-stripe-checkout="true"
                target="_blank"
                rel="noopener noreferrer"
                aria-label="Buy this product securely with Stripe"
            >
                BUY NOW
            </a>
        `;

    }


    /* =========================================================
       BUILD FEATURES
       ========================================================= */

    function buildFeatures(features, category) {

        if (
            !features.length
        ) {
            return "";
        }


        return `

            <section
                class="q17-tech-section"
            >

                <div
                    class="q17-tech-header"
                >

                    <div
                        class="q17-tech-label"
                    >

                        <span></span>

                        ENGINEERED FOR EVERYDAY

                    </div>


                    <h2>

                        Built for

                        <span>
                            ${escapeHTML(category)}.
                        </span>

                    </h2>

                </div>


                <div
                    class="q17-tech-grid"
                >

                    ${features
                        .map(
                            feature => `

                                <div
                                    class="q17-tech-card"
                                >

                                    <div
                                        class="q17-tech-number"
                                    >
                                        ${escapeHTML(
                                            feature.number
                                        )}
                                    </div>


                                    <div
                                        class="q17-tech-content"
                                    >

                                        <strong>
                                            ${escapeHTML(
                                                feature.title
                                            )}
                                        </strong>


                                        ${
                                            feature.text
                                                ? `
                                                    <p>
                                                        ${escapeHTML(
                                                            feature.text
                                                        )}
                                                    </p>
                                                `
                                                : ""
                                        }

                                    </div>

                                </div>

                            `
                        )
                        .join("")
                    }

                </div>


                <div
                    class="q17-tech-footer"
                >

                    <span
                        class="q17-tech-footer-line"
                    ></span>


                    <span>
                        TECHNICAL DATA
                    </span>


                    <span
                        class="q17-tech-footer-line"
                    ></span>

                </div>

            </section>

        `;

    }


    /* =========================================================
       BUILD SPECIFICATIONS
       ========================================================= */

    function buildSpecifications(
        specifications,
        name
    ) {

        if (
            !specifications.length
        ) {
            return "";
        }


        return `

            <section
                class="q17-specs-section"
            >

                <div
                    class="q17-specs-header"
                >

                    <div
                        class="q17-specs-label"
                    >

                        <span></span>

                        TECHNICAL DATA

                    </div>


                    <h2>

                        ${escapeHTML(name)}

                        <span>
                            Specifications.
                        </span>

                    </h2>

                </div>


                <div
                    class="q17-specs-panel"
                >

                    <div
                        class="q17-specs-topline"
                    >

                        <span>

                            ${escapeHTML(name)}
                            / TECHNICAL PROFILE

                        </span>


                        <span>
                            VOLTICA
                        </span>

                    </div>


                    ${specifications
                        .map(
                            (specification, index) => `

                                <div
                                    class="q17-spec-row"
                                >

                                    <span
                                        class="q17-spec-number"
                                    >

                                        ${String(
                                            index + 1
                                        ).padStart(
                                            2,
                                            "0"
                                        )}

                                    </span>


                                    <span
                                        class="q17-spec-name"
                                    >

                                        ${escapeHTML(
                                            specification.label
                                        )}

                                    </span>


                                    <strong>

                                        ${escapeHTML(
                                            specification.value
                                        )}

                                    </strong>

                                </div>

                            `
                        )
                        .join("")
                    }


                    <div
                        class="q17-spec-bottom"
                    >

                        <span>
                            ${escapeHTML(name)}
                        </span>


                        <span>
                            ENGINEERED FOR EVERYDAY
                        </span>

                    </div>

                </div>

            </section>

        `;

    }


    /* =========================================================
       BUILD PAGE
       ========================================================= */

    function buildProductPage(data) {

        const descriptionHTML =
            formatDescription(
                data.description
            );


        return `

            <!-- =================================================
                 PRODUCT HERO
                 ================================================= -->

            <section
                class="dynamic-product-hero"
            >


                <!-- =================================================
                     GALLERY
                     ================================================= -->

                <div
                    class="dynamic-gallery"
                >

                    <div
                        class="dynamic-main-image"
                    >

                        <span
                            class="dynamic-badge"
                        >
                            ${escapeHTML(
                                data.badge
                            )}
                        </span>


                        <img
                            id="mainProductImage"
                            src="${escapeHTML(
                                data.images[0]
                            )}"
                            alt="${escapeHTML(
                                data.name
                            )}"
                            loading="eager"
                            decoding="async"
                        >

                    </div>


                    <div
                        class="voltica-glass-gallery"
                    >

                        ${data.images
                            .map(
                                (
                                    image,
                                    index
                                ) => `

                                    <button
                                        type="button"
                                        class="voltica-thumb ${
                                            index === 0
                                                ? "active"
                                                : ""
                                        }"
                                        data-image="${escapeHTML(
                                            image
                                        )}"
                                        aria-label="View ${escapeHTML(
                                            data.name
                                        )} image ${index + 1}"
                                        aria-current="${
                                            index === 0
                                                ? "true"
                                                : "false"
                                        }"
                                    >

                                        <img
                                            src="${escapeHTML(
                                                image
                                            )}"
                                            alt="${escapeHTML(
                                                data.name
                                            )} view ${index + 1}"
                                            loading="lazy"
                                            decoding="async"
                                        >


                                        <span>
                                            ${String(
                                                index + 1
                                            ).padStart(
                                                2,
                                                "0"
                                            )}
                                        </span>

                                    </button>

                                `
                            )
                            .join("")
                        }

                    </div>

                </div>


                <!-- =================================================
                     PRODUCT INFORMATION
                     ================================================= -->

                <div
                    class="dynamic-product-info"
                >

                    <span
                        class="dynamic-category"
                    >

                        VOLTICA /
                        ${escapeHTML(
                            data.category
                        )}

                    </span>


                    <!-- TITLE -->

                    <div
                        class="q17-title-tech"
                    >

                        <span
                            class="q17-title-status"
                            aria-hidden="true"
                        ></span>


                        <span
                            class="q17-title-label"
                        >

                            VOLTICA /
                            ${escapeHTML(
                                data.name
                            )}

                        </span>


                        <h1>
                            ${escapeHTML(
                                data.name
                            )}
                        </h1>

                    </div>


                    <!-- SUBTITLE -->

                    <div
                        class="q17-subtitle-glass"
                    >

                        <span
                            class="q17-subtitle-line"
                            aria-hidden="true"
                        ></span>


                        ${createSubtitle(
                            data.category
                        )}

                    </div>


                    <!-- DESCRIPTION -->

                    <div
                        class="q17-description-card"
                    >

                        <div
                            class="q17-description-top"
                        >

                            <span>
                                VOLTICA /
                                PRODUCT INSIGHT
                            </span>

                            <i></i>

                        </div>


                        <div class="q17-description-text">

                            <p>
                                ${descriptionHTML}
                            </p>

                        </div>


                        <div
                            class="q17-description-bottom"
                        >

                            <span>
                                ${escapeHTML(
                                    data.category
                                )}
                            </span>


                            <span>
                                QUALITY SELECTED
                            </span>


                            <span>
                                VOLTICA
                            </span>

                        </div>

                    </div>


                    <!-- PURCHASE -->

                    <div
                        class="q17-purchase-zone"
                    >

                        <div
                            class="q17-price-glass"
                        >

                            <span
                                class="q17-price-label"
                            >

                                ${escapeHTML(
                                    data.name
                                )}
                                / PRICE

                            </span>


                            <strong>
                                $${escapeHTML(
                                    data.price
                                )}
                            </strong>


                            <span
                                class="q17-price-currency"
                            >
                                ${escapeHTML(
                                    data.currency
                                )}
                            </span>

                        </div>


                        ${buildBuyButton(
                            data.stripe,
                            "q17-buy-button"
                        )}


                        <div
                            class="q17-trust-glass"
                        >

                            <span>
                                ✓ SECURE CHECKOUT
                            </span>


                            <span>
                                ✓ QUALITY SELECTED
                            </span>

                        </div>

                    </div>

                </div>

            </section>


            <!-- =================================================
                 FEATURES
                 ================================================= -->

            ${buildFeatures(
                data.features,
                data.category
            )}


            <!-- =================================================
                 SPECIFICATIONS
                 ================================================= -->

            ${buildSpecifications(
                data.specifications,
                data.name
            )}


            <!-- =================================================
                 FINAL CTA
                 ================================================= -->

            <section
                class="dynamic-final"
            >

                <div
                    class="final-glass-panel"
                >

                    <div
                        class="final-label"
                    >

                        ${escapeHTML(
                            data.name
                        )}

                    </div>


                    <div
                        class="final-line"
                    ></div>


                    <h2>

                        Ready to

                        <span>
                            move?
                        </span>

                    </h2>


                    <p>

                        ${escapeHTML(
                            data.description
                                .replace(
                                    /\s+/g,
                                    " "
                                )
                                .substring(
                                    0,
                                    180
                                )
                        )}

                    </p>


                    ${buildFinalButton(
                        data.stripe
                    )}


                    <div
                        class="final-meta"
                    >

                        <span>
                            SECURE CHECKOUT
                        </span>


                        <span>
                            QUALITY SELECTED
                        </span>


                        <span>
                            VOLTICA
                        </span>

                    </div>

                </div>

            </section>


            <!-- =================================================
                 BOTTOM NAVIGATION
                 ================================================= -->

            <section
                class="voltica-bottom-nav"
            >

                <div
                    class="voltica-nav-line"
                ></div>


                <div
                    class="voltica-nav-buttons"
                >

                    <a
                        href="index.html"
                        class="voltica-nav-button home-button"
                    >

                        <span
                            class="nav-icon"
                            aria-hidden="true"
                        >
                            ⌂
                        </span>


                        <span
                            class="nav-button-text"
                        >

                            <small>
                                RETURN
                            </small>


                            <strong>
                                HOME
                            </strong>

                        </span>

                    </a>


                    <a
                        href="store.html"
                        class="voltica-nav-button store-button"
                    >

                        <span
                            class="nav-icon"
                            aria-hidden="true"
                        >
                            V
                        </span>


                        <span
                            class="nav-button-text"
                        >

                            <small>
                                EXPLORE
                            </small>


                            <strong>
                                STORE
                            </strong>

                        </span>

                    </a>

                </div>


                <div
                    class="voltica-nav-brand"
                >
                    VOLTICA
                </div>

            </section>

        `;

    }


    /* =========================================================
       GALLERY ENGINE
       ========================================================= */

    function initGallery(container) {

        const mainImage =
            container.querySelector(
                "#mainProductImage"
            );


        const thumbnails =
            container.querySelectorAll(
                ".voltica-thumb"
            );


        if (
            !mainImage ||
            !thumbnails.length
        ) {
            return;
        }


        thumbnails.forEach(
            thumbnail => {

                thumbnail.addEventListener(
                    "click",
                    () => {

                        const newImage =
                            thumbnail.dataset.image;


                        if (!newImage) {
                            return;
                        }


                        if (
                            mainImage.src.endsWith(
                                newImage
                            )
                        ) {
                            return;
                        }


                        thumbnail.blur();


                        mainImage.style.opacity =
                            "0";


                        window.setTimeout(
                            () => {

                                mainImage.src =
                                    newImage;


                                mainImage.style.opacity =
                                    "1";

                            },
                            150
                        );


                        thumbnails.forEach(
                            item => {

                                item.classList.remove(
                                    "active"
                                );

                                item.setAttribute(
                                    "aria-current",
                                    "false"
                                );

                            }
                        );


                        thumbnail.classList.add(
                            "active"
                        );


                        thumbnail.setAttribute(
                            "aria-current",
                            "true"
                        );

                    }
                );

            }
        );

    }


    /* =========================================================
       IMAGE FALLBACKS
       ========================================================= */

    function initImageFallbacks(container) {

        const images =
            container.querySelectorAll(
                "img"
            );


        images.forEach(
            image => {

                image.addEventListener(
                    "error",
                    () => {

                        image.classList.add(
                            "image-load-error"
                        );


                        image.style.opacity =
                            "0.25";

                    },
                    {
                        once: true
                    }
                );

            }
        );

    }


    /* =========================================================
       EXTERNAL LINKS
       ========================================================= */

    function initExternalLinks(container) {

        const links =
            container.querySelectorAll(
                'a[data-stripe-checkout="true"]'
            );


        links.forEach(
            link => {

                link.addEventListener(
                    "click",
                    () => {

                        link.setAttribute(
                            "aria-busy",
                            "true"
                        );

                    }
                );

            }
        );

    }


    /* =========================================================
       PAGE METADATA
       ========================================================= */

    function updatePageMetadata(data) {

        document.title =
            `${data.name} — Voltica Store`;


        const metaDescription =
            document.querySelector(
                'meta[name="description"]'
            );


        if (
            metaDescription
        ) {

            metaDescription.setAttribute(
                "content",
                data.description
                    .replace(
                        /\s+/g,
                        " "
                    )
                    .trim()
                    .substring(
                        0,
                        155
                    )
            );

        }

    }


    /* =========================================================
       ERROR SCREEN
       ========================================================= */

    function renderError(
        container,
        label,
        title,
        message
    ) {

        container.innerHTML = `

            <section
                class="product-not-found"
            >

                <span>
                    ${escapeHTML(label)}
                </span>


                <h1>
                    ${escapeHTML(title)}
                </h1>


                <p>
                    ${escapeHTML(message)}
                </p>


                <a
                    href="store.html"
                >
                    RETURN TO STORE
                </a>

            </section>

        `;

    }


})();

</script>


</body>

</html>
