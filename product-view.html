<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <meta
        name="description"
        content="Voltica Store — Product">

    <title>Voltica Store</title>

    <link
        rel="stylesheet"
        href="style.css">

</head>


<body>


<main
    id="productView"
    class="dynamic-product-page">

    <div class="product-loading">
        LOADING PRODUCT...
    </div>

</main>


<!-- =====================================================
     VOLTICA DATABASE
     ===================================================== -->

<script src="products.js"></script>


<!-- =====================================================
     VOLTICA PRODUCT ENGINE
     ===================================================== -->

<script>

document.addEventListener(
    "DOMContentLoaded",
    function () {

        "use strict";


        /* =================================================
           CONTAINER
           ================================================= */

        const container =
            document.getElementById(
                "productView"
            );


        if (!container) {
            return;
        }


        /* =================================================
           URL PRODUCT ID
           ================================================= */

        const params =
            new URLSearchParams(
                window.location.search
            );


        const productId =
            params.get("id");


        /* =================================================
           DATABASE CHECK
           ================================================= */

        if (
            typeof volticaProducts === "undefined" ||
            !Array.isArray(volticaProducts)
        ) {

            showError(
                "DATABASE ERROR",
                "Product database unavailable.",
                "products.js could not be loaded."
            );

            return;
        }


        /* =================================================
           FIND PRODUCT
           ================================================= */

        const product =
            volticaProducts.find(
                function (item) {

                    return String(item.id)
                        .trim()
                        ===
                        String(productId)
                        .trim();

                }
            );


        /* =================================================
           PRODUCT NOT FOUND
           ================================================= */

        if (!product) {

            showError(
                "404",
                "Product not found.",
                productId
                    ? `Product ID: ${productId}`
                    : "No product ID was provided."
            );

            return;
        }


        /* =================================================
           HELPERS
           ================================================= */

        function escapeHTML(value) {

            return String(
                value ?? ""
            )
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");

        }


        function clean(value, fallback = "") {

            if (
                value === undefined ||
                value === null
            ) {
                return fallback;
            }

            const result =
                String(value).trim();

            return result || fallback;
        }


        function getImages() {

            if (
                Array.isArray(product.images)
            ) {

                return product.images
                    .filter(Boolean);

            }


            if (product.image) {
                return [product.image];
            }


            return [];
        }


        function getFeatures() {

            return Array.isArray(
                product.features
            )
                ? product.features
                : [];

        }


        function getSpecifications() {

            return Array.isArray(
                product.specifications
            )
                ? product.specifications
                : [];

        }


        function formatPrice() {

            const price =
                Number(product.price);


            if (
                Number.isNaN(price)
            ) {
                return clean(
                    product.price,
                    "—"
                );
            }


            return price.toFixed(2);

        }


        function createSubtitle() {

            const category =
                clean(
                    product.category,
                    "VOLTICA"
                ).toUpperCase();


            if (
                category.includes("GAMING")
            ) {

                return `
                    <h2>
                        Built to play.
                        <span>Designed to perform.</span>
                    </h2>
                `;

            }


            if (
                category.includes("CREATOR")
            ) {

                return `
                    <h2>
                        Create without limits.
                        <span>Built to move.</span>
                    </h2>
                `;

            }


            if (
                category.includes("LIFESTYLE")
            ) {

                return `
                    <h2>
                        Technology for life.
                        <span>Designed different.</span>
                    </h2>
                `;

            }


            if (
                category.includes("TECH")
            ) {

                return `
                    <h2>
                        Smarter everyday.
                        <span>Built to adapt.</span>
                    </h2>
                `;

            }


            return `
                <h2>
                    Wireless freedom.
                    <span>Built to move.</span>
                </h2>
            `;

        }


        /* =================================================
           DATA
           ================================================= */

        const images =
            getImages();


        const features =
            getFeatures();


        const specifications =
            getSpecifications();


        const description =
            clean(
                product.description,
                "Product details not available."
            );


        const category =
            clean(
                product.category,
                "VOLTICA"
            );


        const badge =
            clean(
                product.badge,
                "NEW"
            );


        const currency =
            clean(
                product.currency,
                "USD"
            );


        const stripe =
            clean(
                product.stripe,
                ""
            );


        const name =
            clean(
                product.name,
                "Voltica Product"
            );


        /* =================================================
           PAGE TITLE
           ================================================= */

        document.title =
            `${name} — Voltica Store`;


        /* =================================================
           META DESCRIPTION
           ================================================= */

        const metaDescription =
            document.querySelector(
                'meta[name="description"]'
            );


        if (metaDescription) {

            metaDescription.setAttribute(
                "content",
                description.substring(
                    0,
                    155
                )
            );

        }


        /* =================================================
           IMAGE CHECK
           ================================================= */

        if (images.length === 0) {

            showError(
                "IMAGE ERROR",
                "Product images unavailable.",
                name
            );

            return;
        }


        /* =================================================
           SAFE STRIPE
           ================================================= */

        const buyButton =
            stripe
                ? `
                    <a
                        href="${escapeHTML(stripe)}"
                        class="q17-buy-button">

                        <span>
                            BUY NOW
                        </span>

                    </a>
                `
                : `
                    <div
                        class="q17-buy-button"
                        style="opacity:.45;pointer-events:none;">

                        <span>
                            COMING SOON
                        </span>

                    </div>
                `;


        const finalButton =
            stripe
                ? `
                    <a
                        href="${escapeHTML(stripe)}"
                        class="final-buy-button">

                        BUY NOW

                    </a>
                `
                : `
                    <div
                        class="final-buy-button"
                        style="opacity:.45;pointer-events:none;">

                        COMING SOON

                    </div>
                `;


        /* =================================================
           BUILD PAGE
           ================================================= */

        container.innerHTML = `

            <!-- =============================================
                 HERO
                 ============================================= -->

            <section
                class="dynamic-product-hero">


                <!-- =========================================
                     GALLERY
                     ========================================= -->

                <div
                    class="dynamic-gallery">


                    <div
                        class="dynamic-main-image">


                        <span
                            class="dynamic-badge">

                            ${escapeHTML(badge)}

                        </span>


                        <img
                            id="mainProductImage"
                            src="${escapeHTML(images[0])}"
                            alt="${escapeHTML(name)}">


                    </div>


                    <div
                        class="voltica-glass-gallery">


                        ${images.map(
                            function (
                                image,
                                index
                            ) {

                                return `

                                    <button
                                        type="button"
                                        class="voltica-thumb ${
                                            index === 0
                                                ? "active"
                                                : ""
                                        }"
                                        data-image="${escapeHTML(image)}">


                                        <img
                                            src="${escapeHTML(image)}"
                                            alt="${escapeHTML(name)} view ${index + 1}">


                                        <span>
                                            ${String(
                                                index + 1
                                            ).padStart(2, "0")}
                                        </span>


                                    </button>

                                `;

                            }
                        ).join("")}


                    </div>

                </div>


                <!-- =========================================
                     PRODUCT INFO
                     ========================================= -->

                <div
                    class="dynamic-product-info">


                    <span
                        class="dynamic-category">

                        VOLTICA /
                        ${escapeHTML(category)}

                    </span>


                    <!-- =====================================
                         TITLE
                         ===================================== -->

                    <div
                        class="q17-title-tech">


                        <span
                            class="q17-title-status">
                        </span>


                        <span
                            class="q17-title-label">

                            VOLTICA /
                            ${escapeHTML(name)}

                        </span>


                        <h1>
                            ${escapeHTML(name)}
                        </h1>


                    </div>


                    <!-- =====================================
                         SMART SUBTITLE
                         ===================================== -->

                    <div
                        class="q17-subtitle-glass">


                        <span
                            class="q17-subtitle-line">
                        </span>


                        ${createSubtitle()}


                    </div>


                    <!-- =====================================
                         DESCRIPTION
                         ===================================== -->

                    <div
                        class="q17-description-card">


                        <div
                            class="q17-description-top">

                            <span>
                                VOLTICA /
                                PRODUCT INSIGHT
                            </span>

                            <i></i>

                        </div>


                        <p>
                            ${escapeHTML(description)}
                        </p>


                        <div
                            class="q17-description-bottom">


                            <span>
                                ${escapeHTML(category)}
                            </span>


                            <span>
                                QUALITY SELECTED
                            </span>


                            <span>
                                VOLTICA
                            </span>


                        </div>


                    </div>


                    <!-- =====================================
                         PURCHASE
                         ===================================== -->

                    <div
                        class="q17-purchase-zone">


                        <div
                            class="q17-price-glass">


                            <span
                                class="q17-price-label">

                                ${escapeHTML(name)}
                                / PRICE

                            </span>


                            <strong>

                                $${formatPrice()}

                            </strong>


                            <span
                                class="q17-price-currency">

                                ${escapeHTML(currency)}

                            </span>


                        </div>


                        ${buyButton}


                        <div
                            class="q17-trust-glass">


                            <span>
                                ✓ SECURE CHECKOUT
                            </span>


                            <span>
                                ✓ QUALITY SELECTED
                            </span>


                        </div>


                    </div>


                </div>


            </section>


            <!-- =============================================
                 FEATURES
                 ============================================= -->

            ${
                features.length
                    ? `

                    <section
                        class="q17-tech-section">


                        <div
                            class="q17-tech-header">


                            <div
                                class="q17-tech-label">

                                <span></span>

                                ENGINEERED FOR EVERYDAY

                            </div>


                            <h2>

                                Built for

                                <span>
                                    ${escapeHTML(
                                        category
                                    )}.
                                </span>

                            </h2>


                        </div>


                        <div
                            class="q17-tech-grid">


                            ${features.map(
                                function (
                                    feature
                                ) {

                                    const number =
                                        clean(
                                            feature[0],
                                            ""
                                        );


                                    const title =
                                        clean(
                                            feature[1],
                                            ""
                                        );


                                    const text =
                                        clean(
                                            feature[2],
                                            ""
                                        );


                                    return `

                                        <div
                                            class="q17-tech-card">


                                            <div
                                                class="q17-tech-number">

                                                ${escapeHTML(
                                                    number
                                                )}

                                            </div>


                                            <div
                                                class="q17-tech-content">


                                                <strong>
                                                    ${escapeHTML(
                                                        title
                                                    )}
                                                </strong>


                                                ${
                                                    text
                                                        ? `
                                                        <p>
                                                            ${escapeHTML(
                                                                text
                                                            )}
                                                        </p>
                                                        `
                                                        : ""
                                                }


                                            </div>


                                        </div>

                                    `;

                                }
                            ).join("")}


                        </div>


                        <div
                            class="q17-tech-footer">


                            <span
                                class="q17-tech-footer-line">
                            </span>


                            <span>
                                TECHNICAL DATA
                            </span>


                            <span
                                class="q17-tech-footer-line">
                            </span>


                        </div>


                    </section>

                    `
                    : ""
            }


            <!-- =============================================
                 SPECIFICATIONS
                 ============================================= -->

            ${
                specifications.length
                    ? `

                    <section
                        class="q17-specs-section">


                        <div
                            class="q17-specs-header">


                            <div
                                class="q17-specs-label">

                                <span></span>

                                TECHNICAL DATA

                            </div>


                            <h2>

                                ${escapeHTML(name)}

                                <span>
                                    Specifications.
                                </span>

                            </h2>


                        </div>


                        <div
                            class="q17-specs-panel">


                            <div
                                class="q17-specs-topline">


                                <span>

                                    ${escapeHTML(name)}
                                    / TECHNICAL PROFILE

                                </span>


                                <span>
                                    VOLTICA
                                </span>


                            </div>


                            ${specifications.map(
                                function (
                                    spec,
                                    index
                                ) {

                                    return `

                                        <div
                                            class="q17-spec-row">


                                            <span
                                                class="q17-spec-number">

                                                ${String(
                                                    index + 1
                                                ).padStart(
                                                    2,
                                                    "0"
                                                )}

                                            </span>


                                            <span
                                                class="q17-spec-name">

                                                ${escapeHTML(
                                                    spec[0]
                                                )}

                                            </span>


                                            <strong>

                                                ${escapeHTML(
                                                    spec[1]
                                                )}

                                            </strong>


                                        </div>

                                    `;

                                }
                            ).join("")}


                            <div
                                class="q17-spec-bottom">


                                <span>
                                    ${escapeHTML(name)}
                                </span>


                                <span>
                                    ENGINEERED FOR EVERYDAY
                                </span>


                            </div>


                        </div>


                    </section>

                    `
                    : ""
            }


            <!-- =============================================
                 FINAL CTA
                 ============================================= -->

            <section
                class="dynamic-final">


                <div
                    class="final-glass-panel">


                    <div
                        class="final-label">

                        ${escapeHTML(name)}

                    </div>


                    <div
                        class="final-line">
                    </div>


                    <h2>

                        Ready to

                        <span>
                            move?
                        </span>

                    </h2>


                    <p>

                        ${escapeHTML(
                            description.substring(
                                0,
                                180
                            )
                        )}

                    </p>


                    ${finalButton}


                    <div
                        class="final-meta">


                        <span>
                            SECURE CHECKOUT
                        </span>


                        <span>
                            QUALITY SELECTED
                        </span>


                        <span>
                            VOLTICA
                        </span>


                    </div>


                </div>


            </section>


            <!-- =============================================
                 NAVIGATION
                 ============================================= -->

            <section
                class="voltica-bottom-nav">


                <div
                    class="voltica-nav-line">
                </div>


                <div
                    class="voltica-nav-buttons">


                    <a
                        href="index.html"
                        class="voltica-nav-button home-button">


                        <span
                            class="nav-icon">

                            ⌂

                        </span>


                        <span
                            class="nav-button-text">


                            <small>
                                RETURN
                            </small>


                            <strong>
                                HOME
                            </strong>


                        </span>


                    </a>


                    <a
                        href="store.html"
                        class="voltica-nav-button store-button">


                        <span
                            class="nav-icon">

                            V

                        </span>


                        <span
                            class="nav-button-text">


                            <small>
                                EXPLORE
                            </small>


                            <strong>
                                STORE
                            </strong>


                        </span>


                    </a>


                </div>


                <div
                    class="voltica-nav-brand">

                    VOLTICA

                </div>


            </section>

        `;


        /* =================================================
           GALLERY ENGINE
           ================================================= */

        const mainImage =
            document.getElementById(
                "mainProductImage"
            );


        const thumbnails =
            container.querySelectorAll(
                ".voltica-thumb"
            );


        thumbnails.forEach(
            function (thumbnail) {

                thumbnail.addEventListener(
                    "click",
                    function () {

                        const newImage =
                            this.dataset.image;


                        if (
                            !mainImage ||
                            !newImage
                        ) {
                            return;
                        }


                        if (
                            mainImage.getAttribute(
                                "src"
                            ) === newImage
                        ) {
                            return;
                        }


                        mainImage.style.opacity =
                            "0";


                        setTimeout(
                            function () {

                                mainImage.src =
                                    newImage;


                                mainImage.style.opacity =
                                    "1";

                            },
                            150
                        );


                        thumbnails.forEach(
                            function (item) {

                                item.classList.remove(
                                    "active"
                                );

                            }
                        );


                        this.classList.add(
                            "active"
                        );

                    }
                );

            }
        );


        /* =================================================
           IMAGE ERROR HANDLING
           ================================================= */

        container
            .querySelectorAll(
                "img"
            )
            .forEach(
                function (image) {

                    image.addEventListener(
                        "error",
                        function () {

                            this.style.opacity =
                                "0.25";

                        }
                    );

                }
            );


        /* =================================================
           DEBUG
           ================================================= */

        console.log(
            "✓ VOLTICA PRODUCT LOADED:",
            name
        );

        console.log(
            "✓ PRODUCT ID:",
            product.id
        );

        console.log(
            "✓ IMAGES:",
            images.length
        );

        console.log(
            "✓ FEATURES:",
            features.length
        );

        console.log(
            "✓ SPECIFICATIONS:",
            specifications.length
        );

    });


/* ============================================================
   ERROR SCREEN
   ============================================================ */

function showError(
    label,
    title,
    message
) {

    const container =
        document.getElementById(
            "productView"
        );


    if (!container) {
        return;
    }


    container.innerHTML = `

        <section
            class="product-not-found">


            <span>
                ${String(label)}
            </span>


            <h1>
                ${String(title)}
            </h1>


            <p>
                ${String(message)}
            </p>


            <a
                href="store.html">

                RETURN TO STORE

            </a>


        </section>

    `;

}

</script>


</body>

</html>
