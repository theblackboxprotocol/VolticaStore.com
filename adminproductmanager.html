<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Voltica Store — Product Manager</title>

    <meta
        name="description"
        content="Voltica Store Product Management"
    >

    <style>

        /* =====================================================
           RESET
        ===================================================== */

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        html {
            scroll-behavior: smooth;
        }


        body {

            min-height: 100vh;

            background:
                radial-gradient(
                    circle at 20% 10%,
                    rgba(255,255,255,.07),
                    transparent 30%
                ),
                radial-gradient(
                    circle at 80% 80%,
                    rgba(120,120,255,.05),
                    transparent 35%
                ),
                #050505;

            color: #fff;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            padding: 30px 15px 80px;

        }


        /* =====================================================
           CONTAINER
        ===================================================== */

        .admin-container {

            width: 100%;

            max-width: 950px;

            margin: auto;

        }


        /* =====================================================
           HEADER
        ===================================================== */

        .admin-header {

            margin-bottom: 30px;

            padding: 28px;

            border:
                1px solid
                rgba(255,255,255,.12);

            border-radius: 24px;

            background:
                linear-gradient(
                    135deg,
                    rgba(255,255,255,.09),
                    rgba(255,255,255,.025)
                );

            backdrop-filter:
                blur(25px);

            -webkit-backdrop-filter:
                blur(25px);

            box-shadow:
                0 25px 80px
                rgba(0,0,0,.55);

        }


        .admin-label {

            font-size: 10px;

            letter-spacing: .35em;

            color:
                rgba(255,255,255,.42);

            margin-bottom: 10px;

        }


        .admin-header h1 {

            font-size:
                clamp(28px,5vw,48px);

            font-weight: 300;

            letter-spacing: -.03em;

            margin-bottom: 10px;

        }


        .admin-header p {

            color:
                rgba(255,255,255,.48);

            font-size: 14px;

            line-height: 1.6;

        }


        /* =====================================================
           FORM CARD
        ===================================================== */

        .product-form {

            padding: 28px;

            border:
                1px solid
                rgba(255,255,255,.11);

            border-radius: 24px;

            background:
                rgba(255,255,255,.035);

            backdrop-filter:
                blur(25px);

            -webkit-backdrop-filter:
                blur(25px);

            box-shadow:
                0 30px 90px
                rgba(0,0,0,.55);

        }


        /* =====================================================
           FIELD GROUP
        ===================================================== */

        .field {

            margin-bottom: 22px;

        }


        .field label {

            display: block;

            margin-bottom: 9px;

            font-size: 10px;

            letter-spacing: .22em;

            text-transform: uppercase;

            color:
                rgba(255,255,255,.48);

        }


        input,
        select,
        textarea {

            width: 100%;

            border:
                1px solid
                rgba(255,255,255,.12);

            border-radius: 13px;

            background:
                rgba(0,0,0,.42);

            color: #fff;

            padding: 15px 16px;

            outline: none;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            font-size: 14px;

            transition:
                border-color .25s ease,
                background .25s ease,
                box-shadow .25s ease;

        }


        input:focus,
        select:focus,
        textarea:focus {

            border-color:
                rgba(255,255,255,.38);

            background:
                rgba(255,255,255,.045);

            box-shadow:
                0 0 30px
                rgba(255,255,255,.045);

        }


        textarea {

            min-height: 130px;

            resize: vertical;

            line-height: 1.6;

        }


        /* =====================================================
           TWO COLUMN
        ===================================================== */

        .field-grid {

            display: grid;

            grid-template-columns:
                repeat(2, minmax(0,1fr));

            gap: 18px;

        }


        /* =====================================================
           SUPPLIER LINK
        ===================================================== */

        .supplier-box {

            padding: 20px;

            margin-bottom: 24px;

            border:
                1px solid
                rgba(255,255,255,.10);

            border-radius: 18px;

            background:
                rgba(255,255,255,.025);

        }


        .supplier-title {

            font-size: 12px;

            letter-spacing: .16em;

            text-transform: uppercase;

            margin-bottom: 18px;

            color:
                rgba(255,255,255,.72);

        }


        /* =====================================================
           IMAGE UPLOAD
        ===================================================== */

        .upload-zone {

            padding: 24px;

            border:
                1px dashed
                rgba(255,255,255,.20);

            border-radius: 18px;

            background:
                rgba(255,255,255,.025);

            text-align: center;

            transition:
                border-color .25s ease,
                background .25s ease;

        }


        .upload-zone:hover {

            border-color:
                rgba(255,255,255,.42);

            background:
                rgba(255,255,255,.045);

        }


        .upload-zone input {

            border: 0;

            padding: 10px;

            background: transparent;

        }


        .upload-title {

            font-size: 15px;

            margin-bottom: 7px;

        }


        .upload-description {

            color:
                rgba(255,255,255,.42);

            font-size: 12px;

            margin-bottom: 12px;

        }


        /* =====================================================
           IMAGE PREVIEW
        ===================================================== */

        #imagePreview {

            display: grid;

            grid-template-columns:
                repeat(
                    auto-fill,
                    minmax(130px,1fr)
                );

            gap: 14px;

            margin-top: 20px;

        }


        .image-preview-count {

            grid-column: 1 / -1;

            color:
                rgba(255,255,255,.55);

            font-size: 12px;

            letter-spacing: .08em;

        }


        .image-preview-item {

            overflow: hidden;

            border:
                1px solid
                rgba(255,255,255,.10);

            border-radius: 13px;

            background: #080808;

        }


        .image-preview-item img {

            display: block;

            width: 100%;

            height: 120px;

            object-fit: cover;

        }


        .image-preview-name {

            padding: 9px;

            font-size: 10px;

            color:
                rgba(255,255,255,.48);

            overflow: hidden;

            white-space: nowrap;

            text-overflow: ellipsis;

        }


        /* =====================================================
           BUTTONS
        ===================================================== */

        .button-row {

            display: grid;

            grid-template-columns:
                1fr 1fr;

            gap: 14px;

            margin-top: 28px;

        }


        button {

            min-height: 56px;

            border-radius: 14px;

            border:
                1px solid
                rgba(255,255,255,.14);

            cursor: pointer;

            font-size: 11px;

            font-weight: 700;

            letter-spacing: .16em;

            transition:
                transform .25s ease,
                background .25s ease,
                box-shadow .25s ease;

        }


        button:hover {

            transform:
                translateY(-2px);

        }


        .button-primary {

            background:
                linear-gradient(
                    135deg,
                    #ffffff,
                    #cfcfcf
                );

            color: #050505;

            box-shadow:
                0 15px 45px
                rgba(255,255,255,.12);

        }


        .button-primary:hover {

            box-shadow:
                0 20px 60px
                rgba(255,255,255,.20);

        }


        .button-secondary {

            background:
                rgba(255,255,255,.055);

            color: #fff;

        }


        .button-secondary:hover {

            background:
                rgba(255,255,255,.10);

        }


        /* =====================================================
           RESPONSIVE
        ===================================================== */

        @media (max-width: 650px) {

            body {

                padding:
                    15px 10px 50px;

            }


            .admin-header,
            .product-form {

                padding: 20px;

                border-radius: 20px;

            }


            .field-grid {

                grid-template-columns: 1fr;

            }


            .button-row {

                grid-template-columns: 1fr;

            }


            #imagePreview {

                grid-template-columns:
                    repeat(2, minmax(0,1fr));

            }

        }

    </style>

</head>


<body>


<div class="admin-container">


    <!-- =====================================================
         HEADER
         ===================================================== -->

    <header class="admin-header">

        <div class="admin-label">
            VOLTICA STORE
        </div>

        <h1>
            Product Manager
        </h1>

        <p>
            Create and publish products directly
            to the Voltica Store.
        </p>

    </header>



    <!-- =====================================================
         PRODUCT FORM
         ===================================================== -->

    <main class="product-form">


        <!-- =================================================
             BASIC PRODUCT INFORMATION
             ================================================= -->

        <div class="field">

            <label for="productName">
                Product Name
            </label>

            <input
                type="text"
                id="productName"
                placeholder="Voltica TWS Pro"
                autocomplete="off"
            >

        </div>



        <div class="field-grid">


            <div class="field">

                <label for="category">
                    Category
                </label>

                <select id="category">

                    <option value="">
                        Select Category
                    </option>

                    <option value="earbuds">
                        Earbuds
                    </option>

                    <option value="gaming">
                        Gaming Gear
                    </option>

                    <option value="creator">
                        Creator Gear
                    </option>

                    <option value="headphones">
                        Headphones
                    </option>

                    <option value="tech">
                        Tech
                    </option>

                    <option value="lifestyle">
                        Lifestyle
                    </option>

                </select>

            </div>



            <div class="field">

                <label for="price">
                    Voltica Price — USD
                </label>

                <input
                    type="number"
                    id="price"
                    placeholder="59.97"
                    step="0.01"
                    min="0"
                >

            </div>


        </div>



        <!-- =================================================
             SUPPLIER INFORMATION
             ================================================= -->

        <div class="supplier-box">

            <div class="supplier-title">
                Supplier Information
            </div>


            <div class="field">

                <label for="supplierLink">
                    Supplier Product Link
                </label>

                <input
                    type="url"
                    id="supplierLink"
                    placeholder="https://www.cjdropshipping.com/..."
                    autocomplete="off"
                >

            </div>


            <div class="field-grid">


                <div class="field">

                    <label for="cjSku">
                        Supplier SKU
                    </label>

                    <input
                        type="text"
                        id="cjSku"
                        placeholder="CJXXXXXXXXXXXX"
                        autocomplete="off"
                    >

                </div>


                <div class="field">

                    <label for="cost">
                        Supplier Cost — USD
                    </label>

                    <input
                        type="number"
                        id="cost"
                        placeholder="18.03"
                        step="0.01"
                        min="0"
                    >

                </div>


            </div>

        </div>



        <!-- =================================================
             DESCRIPTION
             ================================================= -->

        <div class="field">

            <label for="description">
                Product Description
            </label>

            <textarea
                id="description"
                placeholder="Describe the product..."
            ></textarea>

        </div>



        <!-- =================================================
             FEATURES
             ================================================= -->

        <div class="field">

            <label for="features">
                Features
            </label>

            <textarea
                id="features"
                placeholder="01 — Feature Name — Description&#10;02 — Feature Name — Description&#10;03 — Feature Name — Description"
            ></textarea>

        </div>



        <!-- =================================================
             SPECIFICATIONS
             ================================================= -->

        <div class="field">

            <label for="specifications">
                Specifications
            </label>

            <textarea
                id="specifications"
                placeholder="Material: Fiber-Reinforced Polymer&#10;Bluetooth: 5.3&#10;Battery: 40 Hours"
            ></textarea>

        </div>



        <!-- =================================================
             PRODUCT IMAGES
             ================================================= -->

        <div class="field">

            <label>
                Product Images
            </label>


            <div class="upload-zone">

                <div class="upload-title">
                    Upload Product Images
                </div>

                <div class="upload-description">
                    Select all product images at once.
                </div>


                <input
                    type="file"
                    id="productImages"
                    accept="image/jpeg,image/png,image/webp,image/gif"
                    multiple
                >

            </div>


            <div id="imagePreview"></div>

        </div>



        <!-- =================================================
             ACTIONS
             ================================================= -->

        <div class="button-row">

            <button
                type="button"
                id="clearImages"
                class="button-secondary">

                CLEAR IMAGES

            </button>


            <button
                type="button"
                id="add product"
                
                class="button-primary">

                ADD PRODUCT

            </button>

        </div>


    </main>


</div>



<!-- =========================================================
     ADMIN JAVASCRIPT
     ========================================================= -->

<script src="admin.js"></script>


</body>

</html>
