<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voltica Store - Article</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="store-page" style="padding: 60px 20px;">
        <a href="store.html" class="product-button" style="margin-bottom: 30px;">← RETOUR À LA BOUTIQUE</a>
        
        <div id="productDetailContainer" class="store-section" style="max-width: 900px; margin:0 auto;">
            <!-- Rendu dynamique par JS -->
        </div>
    </div>

    <script src="products.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const params = new URLSearchParams(window.location.search);
            const prodId = params.get('id');
            const product = getProductById(prodId);
            const container = document.getElementById('productDetailContainer');

            if (!product) {
                container.innerHTML = "<h2>Produit introuvable.</h2>";
                return;
            }

            container.innerHTML = `
                <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 40px; align-items: center;">
                    <div class="store-product">
                        <div class="product-image" style="aspect-ratio: 1/1;">
                            <img src="${product.imageUrl}" alt="${product.name}" style="width:100%; height:100%; object-fit:cover;">
                        </div>
                    </div>
                    <div>
                        <span class="section-index">VOLTICA / ${product.category.toUpperCase()}</span>
                        <h1 style="font-size: 2.5rem; margin: 10px 0;">${product.name}</h1>
                        <p style="color: rgba(255,255,255,0.7); margin-bottom: 20px;">${product.description}</p>
                        <div style="font-size: 2rem; font-weight: bold; margin-bottom: 25px;">$${parseFloat(product.price).toFixed(2)} USD</div>
                        <a href="${product.stripeUrl}" target="_blank" class="product-button" style="padding: 15px 30px; font-size: 1rem; width: 100%; text-align: center;">ACHETER MAINTENANT (STRIPE)</a>
                    </div>
                </div>
            `;
        });
    </script>
</body>
</html>
