<style>
    /* =====================================================
       BASE & RESET (Perfectionism)
       ===================================================== */
    *, *::before, *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    html {
        scroll-behavior: smooth;
        -webkit-text-size-adjust: 100%;
    }

    body {
        font-family: "DM Sans", sans-serif;
        background: #050505;
        color: #fff;
        overflow-x: hidden;
        line-height: 1.6;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
    }

    img {
        max-width: 100%;
        height: auto;
        display: block;
    }

    a {
        text-decoration: none;
        color: inherit;
    }

    button {
        font-family: inherit;
        cursor: pointer;
        border: none;
        background: none;
    }


    /* =====================================================
       HEADER — OPTIMIZED & CENTERED
       ===================================================== */
    .store-header {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: 1000;
        display: grid;
        grid-template-columns: 1fr auto 1fr;
        align-items: center;
        padding: 20px 40px;
        background: rgba(5, 5, 5, 0.7);
        backdrop-filter: blur(20px) saturate(180%);
        -webkit-backdrop-filter: blur(20px) saturate(180%);
        border-bottom: 1px solid rgba(255, 255, 255, 0.06);
        transition: all 0.3s ease;
    }

    .store-header.scrolled {
        padding: 16px 40px;
        background: rgba(5, 5, 5, 0.9);
        box-shadow: 0 4px 30px rgba(0, 0, 0, 0.3);
    }

    .logo-acrylic {
        display: flex;
        align-items: center;
        gap: 12px;
        justify-self: start;
        transition: transform 0.3s ease;
    }

    .logo-acrylic:hover {
        transform: scale(1.02);
    }

    .logo-img {
        width: 32px;
        height: 32px;
        object-fit: contain;
    }

    .logo-text {
        font-family: "Manrope", sans-serif;
        font-size: 14px;
        font-weight: 700;
        letter-spacing: 0.15em;
        color: #fff;
    }

    .store-nav {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 40px;
        justify-self: center;
    }

    .nav-link {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        color: rgba(255, 255, 255, 0.65);
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        position: relative;
        padding: 8px 0;
    }

    .nav-link::before {
        content: "";
        position: absolute;
        bottom: 0;
        left: 50%;
        transform: translateX(-50%);
        width: 0;
        height: 1px;
        background: #fff;
        transition: width 0.3s ease;
    }

    .nav-link:hover,
    .nav-link.nav-active {
        color: #fff;
    }

    .nav-link:hover::before,
    .nav-link.nav-active::before {
        width: 100%;
    }

    .nav-pulsar {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: #fff;
        box-shadow: 0 0 10px rgba(255, 255, 255, 0.8);
        animation: pulsePoint 2.5s ease-in-out infinite;
        flex-shrink: 0;
    }

    .nav-active .nav-pulsar {
        box-shadow: 0 0 15px rgba(255, 255, 255, 1), 0 0 30px rgba(255, 255, 255, 0.5);
        animation-duration: 1.5s;
    }

    .header-actions {
        justify-self: end;
        display: flex;
        align-items: center;
        gap: 16px;
    }

    .cart-button {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 10px 18px;
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 999px;
        color: rgba(255, 255, 255, 0.8);
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.1em;
        transition: all 0.3s ease;
        position: relative;
    }

    .cart-button:hover {
        background: rgba(255, 255, 255, 0.1);
        border-color: rgba(255, 255, 255, 0.25);
        color: #fff;
        transform: translateY(-2px);
    }

    .cart-button svg {
        width: 16px;
        height: 16px;
        transition: transform 0.3s ease;
    }

    .cart-button:hover svg {
        transform: scale(1.1);
    }

    .cart-count {
        position: absolute;
        top: -6px;
        right: -6px;
        width: 18px;
        height: 18px;
        background: #fff;
        color: #050505;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 10px;
        font-weight: 700;
        opacity: 0;
        transform: scale(0);
        transition: all 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55);
    }

    .cart-button.has-items .cart-count {
        opacity: 1;
        transform: scale(1);
    }

    .mobile-menu-toggle {
        display: none;
        position: relative;
        width: 40px;
        height: 40px;
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 12px;
        transition: all 0.3s ease;
    }

    .mobile-menu-toggle:hover {
        background: rgba(255, 255, 255, 0.1);
        border-color: rgba(255, 255, 255, 0.2);
    }

    .pulsar-triangle {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 20px;
        height: 20px;
    }

    .pulsar-triangle span {
        position: absolute;
        width: 5px;
        height: 5px;
        background: #fff;
        border-radius: 50%;
        box-shadow: 0 0 8px rgba(255, 255, 255, 0.9);
        animation: pulsePoint 2s ease-in-out infinite;
    }

    .pulsar-triangle span:nth-child(1) {
        top: 0;
        left: 50%;
        transform: translateX(-50%);
    }

    .pulsar-triangle span:nth-child(2) {
        bottom: 2px;
        left: 2px;
        animation-delay: 0.3s;
    }

    .pulsar-triangle span:nth-child(3) {
        bottom: 2px;
        right: 2px;
        animation-delay: 0.6s;
    }

    .mobile-menu-overlay {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: rgba(5, 5, 5, 0.95);
        backdrop-filter: blur(30px) saturate(180%);
        -webkit-backdrop-filter: blur(30px) saturate(180%);
        z-index: 999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 32px;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .mobile-menu-overlay.active {
        opacity: 1;
        pointer-events: auto;
    }

    .mobile-nav-link {
        display: inline-flex;
        align-items: center;
        gap: 14px;
        color: rgba(255, 255, 255, 0.7);
        font-size: 18px;
        font-weight: 600;
        letter-spacing: 0.15em;
        text-transform: uppercase;
        transition: all 0.3s ease;
        padding: 12px 24px;
        border-radius: 12px;
    }

    .mobile-nav-link:hover,
    .mobile-nav-link.nav-active {
        color: #fff;
        background: rgba(255, 255, 255, 0.05);
    }

    .mobile-nav-link .mobile-pulsar-dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: #fff;
        box-shadow: 0 0 10px rgba(255, 255, 255, 0.8);
        animation: pulsePoint 2s ease-in-out infinite;
    }

    .mobile-cart-button {
        margin-top: 20px;
        padding: 14px 32px;
        background: #fff;
        color: #050505;
        border-radius: 999px;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.12em;
        display: inline-flex;
        align-items: center;
        gap: 10px;
        transition: all 0.3s ease;
    }

    .mobile-cart-button:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 30px rgba(255, 255, 255, 0.2);
    }

    .mobile-cart-button svg {
        width: 18px;
        height: 18px;
    }

    @keyframes pulsePoint {
        0%, 100% {
            transform: scale(0.75);
            opacity: 0.35;
        }
        50% {
            transform: scale(1.45);
            opacity: 1;
        }
    }


    /* =====================================================
       PAGE-SPECIFIC ADJUSTMENTS
       ===================================================== */
    .store-hero {
        padding-top: 90px !important;
        padding-bottom: 40px !important;
        min-height: auto !important;

    .products-section {

        transition: all 0.3s ease !important;

    .cart-close-x:hover {

    @media (max-width: 560px) {

        }

            padding-top: 5px !important;
        }
    }
</style>

</head>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        // Mobile Menu Logic
        const menuToggle = document.getElementById('mobileMenuToggle');
        const menuOverlay = document.getElementById('mobileMenuOverlay');
        const header = document.getElementById('storeHeader');
        
        if (menuToggle && menuOverlay) {
            menuToggle.addEventListener('click', function() {
                const isExpanded = menuToggle.getAttribute('aria-expanded') === 'true';
                menuToggle.setAttribute('aria-expanded', !isExpanded);
                menuOverlay.classList.toggle('active');
                menuOverlay.setAttribute('aria-hidden', isExpanded);
                document.body.style.overflow = isExpanded ? '' : 'hidden';
            });
            
            const navLinks = menuOverlay.querySelectorAll('a');
            navLinks.forEach(link => {
                link.addEventListener('click', () => {
                    menuOverlay.classList.remove('active');
                    menuToggle.setAttribute('aria-expanded', 'false');
                    menuOverlay.setAttribute('aria-hidden', 'true');
                    document.body.style.overflow = '';
                });
            });

            menuOverlay.addEventListener('click', function(e) {
                if (e.target === menuOverlay) {
                    menuOverlay.classList.remove('active');
                    menuToggle.setAttribute('aria-expanded', 'false');
                    menuOverlay.setAttribute('aria-hidden', 'true');
                    document.body.style.overflow = '';
                }
            });
        }

        // Cart Button Logic
        const cartOpenButtons = document.querySelectorAll('[data-cart-open]');
        const cartDrawer = document.getElementById('cartDrawer');
        const cartOverlay = document.getElementById('cartOverlay');
        
        cartOpenButtons.forEach(button => {
            button.addEventListener('click', function() {
                if (cartDrawer) cartDrawer.classList.add('open');
                if (cartOverlay) cartOverlay.hidden = false;
                document.body.classList.add('cart-is-open');
                
                // Ferme le menu mobile si ouvert
                if (menuOverlay) {
                    menuOverlay.classList.remove('active');
                    menuToggle.setAttribute('aria-expanded', 'false');
                    menuOverlay.setAttribute('aria-hidden', 'true');
                    document.body.style.overflow = '';
                }
            });
        });

        // Close cart logic
        const cartClose = document.getElementById('cartClose');
        if (cartClose && cartDrawer && cartOverlay) {
            cartClose.addEventListener('click', function() {
                cartDrawer.classList.remove('open');
                cartOverlay.hidden = true;
                document.body.classList.remove('cart-is-open');
            });
        }
        
        if (cartOverlay) {
            cartOverlay.addEventListener('click', function() {
                cartDrawer.classList.remove('open');
                cartOverlay.hidden = true;
                document.body.classList.remove('cart-is-open');
            });
        }

        // Header scroll effect
        if (header) {
            window.addEventListener('scroll', function() {
                if (window.pageYOffset > 50) {
                    header.classList.add('scrolled');
                } else {
                    header.classList.remove('scrolled');
                }
            });
        }

        // Cart count sync
        function updateCartCount() {
            const cartCount = localStorage.getItem('voltica_cart_count') || '0';
            const desktopCount = document.getElementById('cartCount');
            const mobileCount = document.getElementById('mobileCartCount');
            const desktopButton = document.getElementById('desktopCartButton');
            
            if (desktopCount) desktopCount.textContent = cartCount;
            if (mobileCount) mobileCount.textContent = cartCount;
            
            if (desktopButton && parseInt(cartCount) > 0) {
                desktopButton.classList.add('has-items');
            } else if (desktopButton) {
                desktopButton.classList.remove('has-items');
            }
        }
        
        updateCartCount();
        window.addEventListener('storage', updateCartCount);
    });
</script>
