<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Eurêka — Aide académique complémentaire</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: 
        radial-gradient(circle at 20% 30%, rgba(77, 166, 255, 0.08) 0%, transparent 50%),
        radial-gradient(circle at 80% 70%, rgba(10, 47, 92, 0.06) 0%, transparent 50%),
        linear-gradient(160deg, #f8fafd 0%, #eef3f9 40%, #e8eef6 100%);
      color: #1a1a1a;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      line-height: 1.5;
      overflow-x: hidden;
    }

    header {
      background: linear-gradient(135deg, rgba(10, 47, 92, 0.96), rgba(15, 55, 105, 0.94));
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      color: white;
      padding: 18px 28px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 6px 30px rgba(10, 47, 92, 0.18);
      border-bottom: 1px solid rgba(255, 255, 255, 0.12);
    }

    .logo-container {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .logo {
      font-size: 2.5rem;
      font-weight: 800;
      letter-spacing: -0.8px;
      background: linear-gradient(135deg, #ffffff, #cce5ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .badge {
      background: linear-gradient(135deg, #4da6ff, #7ec8ff);
      color: #0a2f5c;
      font-size: 0.8rem;
      font-weight: 700;
      padding: 6px 16px;
      border-radius: 30px;
      box-shadow: 0 4px 12px rgba(77, 166, 255, 0.35);
      letter-spacing: 0.3px;
    }

    .menu-btn {
      background: linear-gradient(135deg, #1e4d8c, #2d6bb5);
      color: white;
      border: none;
      font-size: 1.1rem;
      font-weight: 600;
      padding: 14px 30px;
      border-radius: 14px;
      cursor: pointer;
      min-height: 48px;
      min-width: 120px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      box-shadow: 0 6px 16px rgba(30, 77, 140, 0.35);
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .menu-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 24px rgba(30, 77, 140, 0.45);
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 48px 20px 80px;
      text-align: center;
    }

    .avatar-zone {
      width: 100%;
      max-width: 760px;
      height: 620px;
      background: rgba(255, 255, 255, 0.65);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.7);
      border-radius: 24px;
      display: flex;
      align-items: stretch;
      justify-content: center;
      margin-bottom: 40px;
      box-shadow: 
        0 12px 40px rgba(10, 47, 92, 0.1),
        0 4px 12px rgba(10, 47, 92, 0.05),
        inset 0 1px 0 rgba(255,255,255,0.8);
      position: relative;
      overflow: hidden;
    }

    .avatar-zone::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 24px;
      padding: 1px;
      background: linear-gradient(135deg, rgba(255,255,255,0.6), rgba(77,166,255,0.2), rgba(255,255,255,0.3));
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
    }

    .avatar-zone anam-agent {
      width: 100% !important;
      height: 100% !important;
      display: block;
      border-radius: 24px;
    }

    .buttons {
      display: flex;
      flex-direction: column;
      gap: 0;
      width: 100%;
      max-width: 480px;
    }

    .big-btn {
      background: linear-gradient(135deg, #0a2f5c 0%, #1a4a8a 100%);
      color: white;
      border: none;
      font-size: 1.35rem;
      font-weight: 600;
      padding: 22px 36px;
      border-radius: 16px;
      cursor: pointer;
      min-height: 72px;
      width: 100%;
      box-shadow: 0 8px 24px rgba(10, 47, 92, 0.25);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
      overflow: hidden;
    }

    .big-btn::after {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 60%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
      transform: skewX(-20deg);
      transition: left 0.6s ease;
    }

    .big-btn:hover::after {
      left: 150%;
    }

    .big-btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 14px 32px rgba(10, 47, 92, 0.35);
    }

    .big-btn:active {
      transform: translateY(-1px);
    }

    footer {
      background: rgba(255, 255, 255, 0.75);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      color: #2c3e50;
      text-align: center;
      padding: 22px 20px;
      font-size: 0.95rem;
      border-top: 1px solid rgba(10, 47, 92, 0.08);
      box-shadow: 0 -4px 20px rgba(10, 47, 92, 0.04);
    }

    /* Menu latéral */
    .overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(10, 47, 92, 0.45);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      z-index: 200;
      display: none;
    }

    .overlay.active {
      display: block;
    }

    .side-menu {
      position: fixed;
      top: 0;
      right: -100%;
      width: 360px;
      max-width: 90vw;
      height: 100%;
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      z-index: 300;
      box-shadow: -12px 0 40px rgba(10, 47, 92, 0.18);
      border-left: 1px solid rgba(255, 255, 255, 0.6);
      transition: right 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex;
      flex-direction: column;
      padding: 28px 0;
    }

    .side-menu.active {
      right: 0;
    }

    .menu-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 32px 28px;
      border-bottom: 1px solid rgba(10, 47, 92, 0.1);
    }

    .menu-header h2 {
      font-size: 1.7rem;
      color: #0a2f5c;
      font-weight: 700;
    }

    .close-btn {
      background: rgba(10, 47, 92, 0.08);
      border: none;
      font-size: 1.8rem;
      cursor: pointer;
      color: #0a2f5c;
      width: 48px;
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 14px;
      transition: all 0.2s;
    }

    .close-btn:hover {
      background: rgba(10, 47, 92, 0.16);
      transform: rotate(90deg);
    }

    .menu-options {
      flex: 1;
      overflow-y: auto;
      padding: 16px 0;
    }

    .menu-item {
      padding: 22px 36px;
      font-size: 1.22rem;
      font-weight: 500;
      color: #1a1a1a;
      cursor: pointer;
      border-bottom: 1px solid rgba(10, 47, 92, 0.05);
      transition: all 0.25s ease;
      position: relative;
    }

    .menu-item::before {
      content: '';
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 4px;
      background: linear-gradient(to bottom, #4da6ff, #0a2f5c);
      opacity: 0;
      transition: opacity 0.25s;
    }

    .menu-item:hover {
      background: rgba(10, 47, 92, 0.05);
      padding-left: 42px;
    }

    .menu-item:hover::before {
      opacity: 1;
    }

    .menu-item:active {
      background: rgba(10, 47, 92, 0.08);
    }

    @media (max-width: 700px) {
      .logo {
        font-size: 2rem;
      }
      .avatar-zone {
        height: 520px;
        max-width: 100%;
        border-radius: 20px;
      }
      .big-btn {
        font-size: 1.2rem;
        padding: 20px 28px;
        min-height: 66px;
      }
      .menu-btn {
        padding: 12px 22px;
        font-size: 1.05rem;
        min-width: 100px;
      }
      main {
        padding: 32px 16px 60px;
      }
    }

    @media (max-width: 480px) {
      .avatar-zone {
        height: 480px;
      }
      .logo {
        font-size: 1.75rem;
      }
    }
  </style>
</head>
<body>

  <header>
    <div class="logo-container">
      <div class="logo">Eurêka</div>
      <div class="badge">Bêta v1.0</div>
    </div>
    <button class="menu-btn" id="menuBtn" aria-label="Ouvrir le menu">
      Menu
    </button>
  </header>

  <main>
    <div class="avatar-zone" id="avatarZone">
      <anam-agent agent-id="b4cb0d3e-ad02-5c1d-a956-a992762edfc1" api-base-url="https://lab.anam.ai" layout="inline" agent-name="Eurêka" call-to-action="Parler à Eurêka"></anam-agent>
    </div>

    <div class="buttons">
      <button class="big-btn" id="btnTexte">Poser une question en texte</button>
    </div>
  </main>

  <footer>
    Eurêka — aide académique complémentaire — Bêta v1.0 — Page test non liée à la boutique
  </footer>

  <!-- Overlay et menu -->
  <div class="overlay" id="overlay"></div>
  <div class="side-menu" id="sideMenu">
    <div class="menu-header">
      <h2>Menu</h2>
      <button class="close-btn" id="closeBtn" aria-label="Fermer le menu">×</button>
    </div>
    <div class="menu-options">
      <div class="menu-item" data-action="new">Nouvelle conversation</div>
      <div class="menu-item" data-action="doc">Partager un document</div>
      <div class="menu-item" data-action="history">Historique des conversations</div>
      <div class="menu-item" data-action="books">Mes livres PDF</div>
      <div class="menu-item" data-action="quiz">Mes quiz et erreurs à revoir</div>
      <div class="menu-item" data-action="avatar">Avatar : activé / Texte seul</div>
      <div class="menu-item" data-action="help">Aide : comment utiliser Eurêka ?</div>
    </div>
  </div>

  <script src="https://unpkg.com/@anam-ai/agent-widget" async></script>
  <script>
    const menuBtn = document.getElementById('menuBtn');
    const closeBtn = document.getElementById('closeBtn');
    const overlay = document.getElementById('overlay');
    const sideMenu = document.getElementById('sideMenu');
    const menuItems = document.querySelectorAll('.menu-item');
    const avatarZone = document.getElementById('avatarZone');

    function openMenu() {
      sideMenu.classList.add('active');
      overlay.classList.add('active');
    }

    function closeMenu() {
      sideMenu.classList.remove('active');
      overlay.classList.remove('active');
    }

    menuBtn.addEventListener('click', openMenu);
    closeBtn.addEventListener('click', closeMenu);
    overlay.addEventListener('click', closeMenu);

    menuItems.forEach(item => {
      item.addEventListener('click', () => {
        alert('Bientôt disponible');
        closeMenu();
      });
    });

    // Scroll fluide vers la zone avatar
    document.getElementById('btnTexte').addEventListener('click', () => {
      avatarZone.scrollIntoView({ behavior: 'smooth', block: 'center' });
    });
  </script>

</body>
</html>
